<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オンライン対戦 - 名探偵コナンTCG</title>
<!-- このファイルから tools/build-online.js が online.html を作る(盤面のHTMLは battle.html から取り込む) -->
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/online.css">
<script src="data/cards-data.js"></script>
<script src="js/image-mode.js"></script>
<script src="data/image-names.js"></script>
<script src="js/card-images.js"></script>
<script src="js/card-art.js"></script>
<script src="js/card-detail.js"></script>
<script src="data/text-fixes.js"></script>
<script src="js/deck-storage.js"></script>
<script src="js/replay-storage.js"></script>
<script src="js/p2p.js"></script>
<script src="js/signaling.js"></script>
</head>
<body class="online portrait">
<!--BATTLE_MARKUP-->

<div id="onlineLog" class="hidden"></div>
<div id="onlineBanner" class="hidden"></div>

<div id="lobby">
  <h2>🌐 オンライン対戦</h2>
  <div class="panel">
    <label for="lobbyName">あなたの名前(対戦中、お互いの画面にこの名前が表示されます)</label>
    <input type="text" id="lobbyName" maxlength="12" autocomplete="off" placeholder="例: コナン">
  </div>
  <div class="panel">
    <label for="lobbyDeck">使うデッキ</label>
    <select id="lobbyDeck"></select>
    <div class="note" id="deckNote"></div>
  </div>
  <div class="panel" id="hotseatPanel">
    <label for="hotDeck2">👥 1人で両方を操作(上の「使うデッキ」と、ここで選ぶデッキで対戦。手札は両方見えます)</label>
    <select id="hotDeck2"></select>
    <label for="hotFirst" style="margin-top:8px;">先攻</label>
    <select id="hotFirst"><option value="self">上で選んだデッキ(下側)</option><option value="opponent">ここで選んだデッキ(上側)</option></select>
    <div class="row"><button class="btn" id="hotStart">1人で両方操作して対戦開始</button></div>
  </div>
  <div class="panel" id="cpuPanel">
    <label for="cpuDeck">🤖 CPUと対戦(一人で遊べます。上の「使うデッキ」で戦います)</label>
    <select id="cpuDeck"></select>
    <div id="cpuDeckDate" style="font-size:11px; color:#aaa; margin-top:3px;"></div>
    <label for="cpuType" style="margin-top:8px;">AIタイプ</label>
    <select id="cpuType"></select>
    <div class="row"><button class="btn" id="cpuStart">CPUと対戦開始</button></div>
  </div>
  <div class="panel">
    <label for="lobbyPass">パス(同じパスを入れた2人が対戦します)</label>
    <input type="text" id="lobbyPass" maxlength="64" autocomplete="off" placeholder="例: conan-tonight-1234">
    <div class="row">
      <button class="btn" id="lobbyStart">対戦開始</button>
      <button class="btn ghost" id="lobbyCancel" style="display:none;">キャンセル</button>
      <button class="btn ghost" onclick="location.href='index.html'">← メニューへ戻る</button>
    </div>
    <div class="status" id="lobbyStatus"></div>
    <div class="note">
      パスは相手と同じ文字列にしてください(他の人に推測されにくいものを推奨)。<br>
      <span id="imgNote">カード画像は、それぞれのPCの「画像設定」で指定したフォルダから読み込みます。画像が無いカードは文字のカード(レベル・AP)で表示されます。<br></span>
      カードを長押しすると(PCは右クリックでも)、効果などの詳細が見られます。<br>
      接続の取り次ぎには公開の無料サービス(ntfy.sh)を使い、対戦中の通信は2人のPCが直接やり取りします。会社・学校などのネットワークでは直接つながらないことがあります。
    </div>
  </div>
</div>

<script src="js/battle-engine.js"></script>
<script src="js/cpu-decks.js"></script>
<script src="js/cpu-cards.js"></script>
<script src="js/cpu-player.js"></script>
<script src="js/online-layer.js"></script>
</body>
</html>
