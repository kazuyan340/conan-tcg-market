<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>対戦 - 名探偵コナンTCG</title>
<style>
  :root{
    --bg1:#2c3550; --bg2:#232a42; --bg3:#3a3226; --bg4:#4a3d28;
    --band-fill:#e8e4d8; --ink-dark:#2b2438; --outline:#ffffff; --gold:#e0b34f;
    --navy1:#3d4f88; --navy2:#1b2340;
    --shadow-sm:0 3px 7px rgba(27,20,45,.22);
    --shadow-md:0 8px 16px rgba(27,20,45,.28);
    --shadow-lg:0 14px 28px rgba(27,20,45,.35);
    --card-w:96px; --card-h:134px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif; color:#fff;
    background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 38%, var(--bg3) 60%, var(--bg4) 100%);
    min-height:100vh; padding-bottom:40px;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; background:rgba(0,0,0,.25); box-shadow:var(--shadow-md);
    position:sticky; top:0; z-index:50; flex-wrap:wrap; gap:10px;
  }
  header h1{ font-size:19px; letter-spacing:.04em; }
  .btn{
    background:var(--gold); color:#2b2438; border:none; border-radius:20px;
    padding:8px 18px; font-weight:800; font-size:12.5px; cursor:pointer;
    box-shadow:var(--shadow-sm);
  }
  .btn.ghost{ background:rgba(255,255,255,.15); color:#fff; }
  .btn.small{ padding:5px 12px; font-size:11px; }
  .btn:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.4; cursor:default; filter:none; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .turn-bar{ display:flex; align-items:center; gap:12px; }
  .turn-bar .turn-label{ font-size:13px; font-weight:800; letter-spacing:.03em; }
  .turn-bar .turn-label.self{ color:#8fd3ff; }
  .turn-bar .turn-label.opponent{ color:#ffb2c0; }
  .turn-bar .phase-label{
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px;
    background:rgba(255,255,255,.15);
  }
  .turn-bar .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .zone.inactive-turn{ filter:brightness(.72); transition:filter .25s ease; }
  /* アクション中、現場から直接対象／ガードを選んでもらうための案内バー */
  #actionHintBar{
    position:sticky; top:0; z-index:97; margin:0 auto; max-width:720px;
    display:flex; align-items:center; justify-content:center; gap:14px;
    background:rgba(20,16,36,.92); border:2px solid var(--gold); border-radius:16px;
    padding:10px 20px; font-size:13px; font-weight:700; box-shadow:var(--shadow-lg);
  }
  .zone{ transition:filter .25s ease; }

  /* ---- setup screen ---- */
  .setup{
    max-width:560px; margin:60px auto; background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.25); border-radius:20px; padding:32px;
  }
  .setup h2{ font-size:18px; margin-bottom:20px; text-align:center; }
  .setup-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
  .setup-row label{ font-size:12.5px; opacity:.8; font-weight:700; }
  .setup-row select{
    padding:10px 12px; border-radius:10px; border:none; font-size:13px; background:#fff; color:#222;
  }
  .setup-hint{ font-size:11.5px; opacity:.65; margin-top:-8px; margin-bottom:16px; }

  /* ---- mulligan ---- */
  .mulligan-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    align-items:center; justify-content:center;
  }
  .mulligan-box{
    background:#232a42; border:2px solid rgba(255,255,255,.2); border-radius:20px;
    padding:28px 32px; max-width:640px; text-align:center; box-shadow:var(--shadow-md);
  }
  .mulligan-box h2{ font-size:18px; margin-bottom:8px; }
  .mulligan-hint{ font-size:12px; opacity:.75; margin-bottom:18px; }
  .mulligan-hand-grid{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
  /* 登場時効果ダイアログは、選択肢の枚数や文言の長さで枠のサイズが変わらないよう固定する */
  #deckPeekOverlay .mulligan-box{
    width:1000px; height:560px; max-width:1000px;
    display:flex; flex-direction:column; align-items:stretch;
    background:none; border:none; box-shadow:none;
  }
  #deckPeekOverlay .mulligan-box h2{ font-size:24px; }
  #deckPeekOverlay .mulligan-hint{ font-size:15px; }
  #deckPeekOverlay .mulligan-hand-grid{ flex:1; align-content:center; overflow-y:auto; margin-bottom:12px; gap:16px; }
  #deckPeekOverlay .setup-actions{ margin-top:auto; }
  #deckPeekOverlay .btn{ font-size:15px; padding:11px 24px; }
  /* 左に効果発動中のカード、右にデッキから見た候補カードを並べる(公式のイメージに寄せる)。
     全体をダイアログ中央に寄せたいので、両方とも幅を内容に合わせてjustify-content:centerで揃える */
  .deckpeek-body{ display:flex; gap:26px; flex:1; min-height:0; text-align:left; justify-content:center; align-items:center; }
  .deckpeek-source{ flex:0 0 auto; width:270px; display:flex; align-items:center; justify-content:center; }
  .deckpeek-source img{ width:100%; border-radius:10px; border:3px solid var(--outline); box-shadow:var(--shadow-lg); }
  .deckpeek-main{ flex:0 1 auto; max-width:640px; min-width:0; display:flex; flex-direction:column; text-align:center; }
  #deckPeekOverlay .mulligan-card{ width:130px; height:182px; transition:transform .15s, border-color .1s; }
  /* 候補カードは手札のように少し扇状に開いて重ねて表示する(ボタンと被らないよう余白を確保) */
  #deckPeekCards.fan-layout{ overflow:visible; margin-bottom:28px; }
  #deckPeekCards.fan-layout .mulligan-card{ margin:0 -14px; }
  /* カーソルを合わせたら手札と同じ動きでぴょこっと飛び出す */
  #deckPeekCards.fan-layout .mulligan-card:hover{ transform:translateY(-16px) rotate(0deg) !important; z-index:20 !important; }
  .mulligan-card{
    width:96px; height:134px; border-radius:8px; overflow:hidden; cursor:pointer;
    border:3px solid rgba(255,255,255,.5); transition:transform .1s, border-color .1s;
    position:relative;
  }
  .mulligan-card img{ width:100%; height:100%; object-fit:cover; }
  .mulligan-card.selected{ border-color:var(--gold); transform:translateY(-6px); box-shadow:0 0 0 2px var(--gold); }
  .mulligan-card.dim{ opacity:.4; cursor:default; }
  .order-badge{
    position:absolute; top:4px; left:4px; width:22px; height:22px; border-radius:50%;
    background:var(--gold); color:#2b2438; font-weight:900; font-size:12px;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);
  }
  /* カード画像に重ねずに自分/相手を示すラベル(カードの上に別枠で表示する) */
  .candidate-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .side-tag-label{ font-size:10px; font-weight:800; padding:2px 10px; border-radius:10px; color:#fff; }
  .side-tag-label.side-tag-self{ background:rgba(61,79,136,.92); }
  .side-tag-label.side-tag-opponent{ background:rgba(160,60,60,.92); }
  .setup-actions{ display:flex; justify-content:center; gap:12px; margin-top:8px; }
  .divider{ display:flex; align-items:center; gap:10px; margin:22px 0; opacity:.5; font-size:11px; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:#fff; }
  .file-row{ display:flex; justify-content:center; }
  .file-row input[type=file]{ color:#fff; font-size:12px; }

  /* ---- board (盤面デザイン見本 board.html のプレイマットデザインを流用) ---- */
  .board{ display:none; padding:16px 26px 40px; overflow:hidden; position:relative; }
  /* 今発動中/登場したカードを大きく表示するパネル。盤面の回転・縮小とは無関係に
     画面左に固定表示する(実況動画でカードのテキストが読めるようにするため) */
  .card-spotlight{
    position:fixed; left:18px; top:50%; transform:translateY(-50%); z-index:60;
    width:340px; background:#1b1730; border-radius:16px; padding:16px;
    box-shadow:var(--shadow-lg); border:2px solid rgba(255,255,255,.12);
    display:flex; flex-direction:column; gap:10px; pointer-events:none;
    animation:cardSpotlightIn .25s ease-out;
  }
  @keyframes cardSpotlightIn{ 0%{ opacity:0; transform:translateY(-50%) translateX(-16px); } 100%{ opacity:1; transform:translateY(-50%) translateX(0); } }
  .card-spotlight img{ width:100%; border-radius:10px; box-shadow:var(--shadow-md); }
  .card-spotlight-name{ font-weight:800; font-size:16px; text-align:center; }
  .card-spotlight-text{ font-size:13px; line-height:1.7; opacity:.9; white-space:pre-wrap; max-height:260px; overflow-y:auto; }

  /* カットイン／変装専用の特別演出：斜めのスピード線が入り、カードの絵が右から
     勢いよくスライドインしてくる(アニメ風のカットイン画面をイメージ) */
  .cutin-effect{
    position:fixed; left:0; right:0; top:50%; transform:translateY(-50%);
    height:26vh; min-height:170px; max-height:260px; z-index:80; overflow:hidden;
    pointer-events:none; display:flex; align-items:center; justify-content:flex-end;
    background:#000;
  }
  .cutin-effect .cutin-stripes{
    position:absolute; inset:0; opacity:0;
    background:repeating-linear-gradient(100deg,
      #0a0a14 0px, #0a0a14 18px,
      #eae7f7 18px, #eae7f7 30px,
      #b98ee0 30px, #b98ee0 42px,
      #0a0a14 42px, #0a0a14 74px);
    animation: cutinStripesIn .5s ease-out forwards;
  }
  .cutin-effect .cutin-card{
    position:relative; height:100%; aspect-ratio:3/4;
    clip-path: polygon(24% 0, 100% 0, 100% 100%, 0% 100%);
    transform: translateX(120%);
    animation: cutinCardIn .4s cubic-bezier(.2,.8,.3,1) forwards;
    box-shadow: -10px 0 34px rgba(0,0,0,.6);
  }
  .cutin-effect .cutin-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes cutinStripesIn{ 0%{ opacity:0; } 100%{ opacity:1; } }
  @keyframes cutinCardIn{ 0%{ transform:translateX(120%); } 100%{ transform:translateX(0); } }
  .table-rotate-wrap{ position:relative; margin:0 auto; }
  .table-rotate-wrap .table{ position:absolute; top:50%; left:50%; transform-origin:center center; }
  .table{
    /* max-width:100%は、fitRotatedTableがwrapを縮小した状態で.tableの自然サイズを
       再測定すると、縮小後のwrap幅にtable自身の幅がclampされてしまい、以後ずっと
       小さいサイズに固定される循環バグの原因になっていたため外した(実際の縮小は
       JS側のtransform:scale()で行うので、ここでのmax-widthは不要) */
    position:relative; width:max-content; margin:0 auto;
    padding:36px 30px 50px; display:flex; flex-direction:column; gap:10px;
    background:linear-gradient(180deg, #2c3550 0%, #232a42 38%, #3a3226 60%, #4a3d28 100%);
    border-radius:24px; box-shadow:var(--shadow-md);
    /* 手札を盤面に少し重ねる負のmargin(-60px)の影響で.tableの自動計算される
       高さが実際の見た目より少し小さく出ることがあり、overflow:hiddenのままだと
       デッキ/リムーブエリアなど端の要素が切り取られてしまうため、hiddenにしない */
  }
  .table::before{
    content:''; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 2px, transparent 2px 46px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 2px, transparent 2px 92px);
    mix-blend-mode:overlay; opacity:.5; pointer-events:none;
  }
  .zone{
    position:relative; display:flex; flex-direction:column; gap:14px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px),
      radial-gradient(ellipse at 50% 20%, rgba(255,255,255,.06), transparent 65%),
      linear-gradient(160deg, #223056, #141b34);
    border-radius:22px; padding:22px 20px; border:2px solid rgba(255,255,255,.10);
    box-shadow: inset 0 0 34px rgba(0,0,0,.35), 0 6px 16px rgba(0,0,0,.28);
  }
  .side-label{
    position:relative; z-index:2; font-size:11px; font-weight:800; opacity:.75;
    text-align:center; letter-spacing:.03em;
  }

  .center-col{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .band-tag{
    position:static; background:#1b1730; color:#fff;
    font-size:10.5px; font-weight:800; padding:3px 12px; border-radius:20px; letter-spacing:.03em;
    box-shadow:var(--shadow-sm); align-self:center;
  }
  .num-badge{
    width:40px; height:40px; border-radius:12px; background:#fffdf8; border:3px solid var(--outline);
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:18px; color:var(--ink-dark);
    box-shadow:var(--shadow-sm); flex:0 0 auto; font-variant-numeric:tabular-nums;
    transform:rotate(-90deg); /* 盤面全体の90度回転を打ち消して数字を正面向きにする(位置は変えない) */
  }
  /* 相手側はさらに180度回転しているので、数字は逆向き(+90度)で打ち消す */
  .rotate180 .num-badge{ transform:rotate(90deg); }

  /* ---- hand fan ---- */
  .handfan{
    display:flex; justify-content:center; align-items:flex-end; height:190px; position:relative; z-index:30;
    min-width:640px; /* 手札の枚数で盤面全体のサイズが変動しないように最低幅を確保 */
  }
  .handfan.top{ align-items:flex-start; }
  /* 手札クリック時に「登場させる」等のメニューを出せるよう、扇の重なり用マージンは
     カード本体ではなくラッパー(.card-menu-wrap)側に付ける */
  .handfan .card-menu-wrap{ margin-left:-56px; }
  .handfan .card-menu-wrap:first-child{ margin-left:0; }
  .handfan.top .card-menu-wrap{ margin-left:0; margin-right:-56px; }
  .handfan.top .card-menu-wrap:first-child{ margin-right:0; }
  .handfan .hcard{
    width:130px; height:182px; border-radius:9px;
    border:3px solid #fff; box-shadow:var(--shadow-lg); overflow:hidden;
    flex:0 0 auto; position:relative; transition:transform .15s; cursor:pointer;
    background:linear-gradient(160deg,var(--navy1),var(--navy2));
  }
  .handfan .hcard:hover{ transform:translateY(-16px) rotate(0deg) !important; z-index:20 !important; }
  .handfan .hcard img{ width:100%; height:100%; object-fit:cover; }
  /* 相手側(画面右)の手札の広がる向きを自分側(画面左)と左右対称にする。
     scaleでの鏡写しはカード自身の回転(JSでrotate/translateYを指定)と
     組み合わさると向きの計算がずれて絵柄までおかしくなるため、
     並び順だけを逆にするrow-reverseで対応する(カードの絵柄はそのまま) */
  .handfan.top{ flex-direction:row-reverse; }
  .hand-tray{
    position:absolute; left:50%; bottom:-14px; transform:translateX(-50%);
    width:560px; max-width:90vw; height:30px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.28), transparent 72%); z-index:-1;
  }
  .handfan.top .hand-tray{ bottom:auto; top:-14px; }

  /* ---- deck back ---- */
  .cardback-face{
    position:relative; width:116px; height:162px; /* デッキは縦向きのまま。他のカードと同じ寸法(116x162) */
    border-radius:8px; border:3px solid #ffffff;
    background-image:url('data/images/cardback.jpg'); background-size:cover; background-position:center;
    box-shadow:var(--shadow-md);
  }
  /* デッキの絵柄+バッジ+ドローボタンの合計高さを、現場/パートナー行と揃える */
  /* デッキから手札/FILE/証拠エリアへカードが飛んでいく演出用のゴースト要素。
     他の実際のカード(デッキ/FILE/証拠)と同じ縁取り・影にする */
  .card-fly-ghost{
    border-radius:8px; border:3px solid #ffffff; z-index:999; pointer-events:none; overflow:hidden;
    background-image:url('data/images/cardback.jpg'); background-size:cover; background-position:center;
    box-shadow:var(--shadow-md);
  }

  /* アクション宣言中、アクションしたキャラ→対象のキャラへ光るビームを走らせる */
  .action-arrow-line{
    stroke-linecap: round; opacity: 0;
    transition: stroke-dashoffset .3s ease-out, opacity .25s ease;
  }
  .action-arrow-line.show{ opacity: 1; }

  /* ---- case / partner cards ---- */
  .case-card, .partner-card{
    border-radius:9px; overflow:hidden; position:relative;
    border:3px solid var(--outline); box-shadow:var(--shadow-lg);
    background:linear-gradient(160deg,#3a3a5c,#1c1c34);
    display:flex; flex-direction:column; flex:0 0 auto;
  }
  .partner-card{ width:116px; height:162px; cursor:pointer; transition:transform .15s; }
  .partner-card:hover{ box-shadow:0 0 0 3px var(--gold), var(--shadow-lg); }
  .partner-card.sleeping{ transform:rotate(-90deg); cursor:default; }
  .partner-card.sleeping:hover{ box-shadow:var(--shadow-lg); }
  /* アシスト中はパートナーがFILEエリアに移動して空になるので、枠自体を表示しない */
  /* アシスト中はFILEエリアに移動して見た目上は空になるので、当たり判定も残さず
     クリック・ホバーとも完全に反応しないようにする */
  .partner-card.assisting{ background:none; border:none; box-shadow:none; cursor:default; transform:none; pointer-events:none; }
  .case-card{ width:162px; height:116px; } /* パートナーカード(116x162)を横向きにした同サイズ */
  .case-card .art, .partner-card{
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
    color:#cfcbe4; font-size:10.5px; text-align:center; padding:6px;
  }
  .case-card .art img, .partner-card img{ width:100%; height:100%; object-fit:cover; }
  .case-card .art{ flex:1; }
  .case-card .art .blur-bg{
    position:absolute; inset:0; object-fit:cover; filter:blur(8px) brightness(.55); transform:scale(1.15);
  }
  .case-card .art .fg-img{ position:relative; width:100%; height:100%; object-fit:contain; z-index:1; }
  .case-card .state{
    background:#f4efff; color:#1b1730; font-size:10.5px; font-weight:800; padding:4px 7px;
    text-align:center; letter-spacing:.04em;
  }
  /* 事件編/解決編マーカー：先攻側は右下(後攻用の数字を隠す)、後攻側は左下(先攻用の
     数字を隠す)に重ねて表示する。実物のマーカーカードを模した見た目にする */
  .case-card .case-marker{
    position:absolute; z-index:6; bottom:4px; padding:3px 8px; border-radius:6px;
    font-size:10px; font-weight:800; letter-spacing:.03em; white-space:nowrap;
    background:#2b2438; color:#f4efff; box-shadow:0 2px 6px rgba(0,0,0,.45);
  }
  .case-card .case-marker.corner-right{ right:4px; }
  .case-card .case-marker.corner-left{ left:4px; }

  /* 手札から選ぶ状態(リムーブ／登場させる／カットイン／変装等)の間、盤面(現場・
     パートナー・事件・デッキ・FILE・証拠・リムーブ)と、選んでいない側の手札を
     灰色にして、選ぶべき手札だけが目立つようにする */
  body[data-hand-focus] .zone .playmat-grid{
    filter:grayscale(.85) brightness(.55); transition:filter .2s; pointer-events:none;
  }
  body[data-hand-focus="self"] .zone[data-side="opponent"] .hand-row,
  body[data-hand-focus="opponent"] .zone[data-side="self"] .hand-row{
    filter:grayscale(.85) brightness(.55); transition:filter .2s; pointer-events:none;
  }

  /* ---- character card ---- */
  /* .char-cardはスリープ状態が変わっても常に同じ162x162の正方形の枠を占有する。
     こうすることで、あるカードをスリープさせても他のカードの位置がズレない。
     見た目の向き変更は中の.card-faceだけを自分の中心で回転させて行う
     (カード自身の中心位置はスリープ前後で変わらない)。 */
  .char-card{
    width:162px; height:162px; flex:0 0 auto; position:relative;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .char-card .card-face{
    width:116px; height:162px; border-radius:9px; overflow:hidden;
    border:3px solid var(--outline); box-shadow:var(--shadow-md);
    background:linear-gradient(160deg,var(--navy1),var(--navy2));
    transition:transform .5s cubic-bezier(.3,.7,.4,1);
  }
  .char-card .card-face img{ width:100%; height:100%; object-fit:cover; }
  .char-card:hover .card-face{ box-shadow:0 0 3px var(--gold), var(--shadow-md); }
  .char-card.sleeping{ cursor:default; }
  .char-card.sleeping .card-face{ transform:rotate(-90deg); }
  .char-card.sleeping:hover .card-face{ box-shadow:var(--shadow-md); }
  /* アクションの対象／ガードを現場のカードから直接選べることを示すハイライト */
  @keyframes actionPickablePulse{
    0%, 100%{ box-shadow:0 0 0 3px #ffdd78, 0 0 10px 2px rgba(255,221,120,.7), var(--shadow-md); }
    50%{ box-shadow:0 0 0 3px #ffdd78, 0 0 18px 6px rgba(255,221,120,.95), var(--shadow-md); }
  }
  .char-card.action-pickable{ cursor:pointer; }
  .char-card.action-pickable .card-face{ animation:actionPickablePulse 1.1s ease-in-out infinite; }
  /* アクション［事件］：相手の事件も同じ考え方で直接クリックして対象にできる */
  .case-card.action-pickable{ cursor:pointer; animation:actionPickablePulse 1.1s ease-in-out infinite; }
  /* ミスリード：複数選択できるので、選択中のカードは色を変えてはっきり分かるようにする */
  .char-card.mislead-selected .card-face{ animation:none; box-shadow:0 0 0 3px #7fd4ff, 0 0 18px 6px rgba(127,212,255,.9), var(--shadow-md); }
  /* スタン状態バッジ：.card-face(スリープ時に自身がさらに回転する)の外に置き、
     num-badgeと同様に盤面全体の回転(90度、相手側はさらに180度)だけを打ち消す */
  .stun-badge{
    position:absolute; bottom:6px; left:50%; z-index:6;
    background:#c0392b; color:#fff; font-weight:900; font-size:10px; letter-spacing:.05em;
    padding:2px 8px; border-radius:10px; box-shadow:var(--shadow-sm); pointer-events:none;
    transform:translateX(-50%) rotate(-90deg);
  }
  .rotate180 .stun-badge{ transform:translateX(-50%) rotate(90deg); }
  /* 手札から選べるカードは、常時光らせるのではなくマウスを重ねたカードだけ
     光らせて選べることを示す(JSでmouseenter/mouseleaveを検知して切り替える) */
  .handfan .hcard.action-pickable.hover-glow{
    box-shadow:0 0 0 3px #ffdd78, 0 0 18px 6px rgba(255,221,120,.95), var(--shadow-lg);
  }
  /* 手札から現場に登場した瞬間の着地エフェクト(目立つように光の広がりと拡大パルスを強めにする) */
  @keyframes landingFlash{
    0%{ box-shadow:0 0 0 0 rgba(255,221,120,1), 0 0 30px 10px rgba(255,221,120,1), var(--shadow-md); filter:brightness(1); }
    35%{ box-shadow:0 0 0 14px rgba(255,221,120,.55), 0 0 46px 16px rgba(255,221,120,.85), var(--shadow-md); filter:brightness(1.5); }
    100%{ box-shadow:0 0 0 34px rgba(255,221,120,0), 0 0 0 0 rgba(255,221,120,0), var(--shadow-md); filter:brightness(1); }
  }
  @keyframes landingPulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }
  .char-card.landing-flash .card-face{ animation:landingFlash 1s ease-out; }
  .char-card.landing-flash{ animation:landingPulse 1s ease-out; }
  /* 事件カードの能力が発動したときも、キャラの登場時と同じ黄色いエフェクトを出す */
  .case-card.landing-flash .art{ animation:landingFlash 1s ease-out; }
  .case-card.landing-flash{ animation:landingPulse 1s ease-out; }

  /* ---- band (現場・パートナー・FILE) ---- */
  .band{
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    background:var(--band-fill); border-radius:22px; box-shadow:inset 0 2px 8px rgba(27,20,45,.08), var(--shadow-sm);
    padding:14px 18px; min-height:202px; color:var(--ink-dark);
  }
  .band.pink{ background:#efe6d0; }
  .band .empty-hint{ font-size:11px; opacity:.5; }

  /* ---- playmat grid (board.htmlの盤面と同じ配置) ---- */
  .playmat-grid{
    display:grid;
    grid-template-columns: 202px 930px 202px; /* 中央列は固定幅(カード枚数で盤面サイズが変動しないように) */
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "case   field   deck"
      "evi    partner remove"
      "evi    file    remove";
    gap:14px; align-items:stretch; width:max-content; margin:0 auto;
    /* max-width:100%を付けていると、親の幅が固定カラム合計(202+930+202+gap)より
       狭い場合にグリッド自体は縮まず(固定px指定のため)、auto marginによる中央寄せの
       せいで見た目上デッキ/リムーブエリア(右端の列)が本来の位置より大きく左にずれて
       描画され、盤面の外にはみ出して見えなくなる原因になっていたため外す */
  }
  .pm-case{ grid-area:case; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .pm-field{ grid-area:field; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .pm-field .band{ width:100%; height:202px; }
  /* 現場は中央寄せだと、カードを追加するたびに既存のカードも位置が動いてしまうため、
     左詰めにして後から出したカードだけが動くようにする */
  .field-row{ justify-content:flex-start; }
  .pm-deck{ grid-area:deck; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .pm-evidence{
    grid-area:evi; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--band-fill); border-radius:20px; padding:14px 16px;
    box-shadow:inset 0 2px 8px rgba(27,20,45,.08), var(--shadow-sm); justify-content:flex-start;
  }
  .pm-evidence .evi-header{ display:flex; align-items:center; gap:8px; }
  .evidence-stack{ position:relative; flex:1; width:100%; min-height:120px; }
  .evidence-stack .evi-card-back{
    position:absolute; left:50%; transform:translateX(-50%); width:162px; height:116px;
    border-radius:6px; border:3px solid #ffffff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-md);
  }
  .pm-partner{ grid-area:partner; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .pm-partner .band{ width:100%; height:100%; }
  .pm-remove{
    grid-area:remove; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--band-fill); border-radius:20px; padding:14px 8px;
    box-shadow:inset 0 2px 8px rgba(27,20,45,.08), var(--shadow-sm); justify-content:flex-start;
  }
  /* リムーブエリアは、直近にリムーブされたカードを表向きで表示し続ける
     (山札のように積み重ねず、一番上の1枚だけ見える状態にする) */
  .remove-top{
    width:116px; height:162px; border-radius:9px; overflow:hidden;
    border:3px solid var(--outline); box-shadow:var(--shadow-md);
    background:linear-gradient(160deg,var(--navy1),var(--navy2));
  }
  .remove-top img{ width:100%; height:100%; object-fit:cover; }
  .pm-file{ grid-area:file; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .pm-file .band{ width:100%; height:152px; min-height:0; } /* FILEエリアは横向きのカードしか置かないので低めでよい */
  .file-band{ display:flex; align-items:center; gap:12px; justify-content:flex-start; position:relative; }
  .file-stack{ position:relative; flex:1; align-self:stretch; cursor:pointer; }
  .file-stack .file-card-back{
    position:absolute; top:50%; transform:translateY(-50%); height:116px;
    border-radius:6px; border:3px solid #ffffff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-md);
  }
  /* FILE/証拠は横向きに置くカードなので、裏面画像は縦向きのまま90度回転させて
     中に収める(斜め縞と違い、実際に「寝かせたカード」に見えるようにする) */
  .evi-card-back .back-img, .file-card-back .back-img{
    width:116px; height:162px; flex:0 0 auto; transform:rotate(-90deg);
    background-image:url('data/images/cardback.jpg'); background-size:cover; background-position:center;
  }
  .evi-card-back .evi-face{ width:116px; height:162px; flex:0 0 auto; transform:rotate(-90deg); overflow:hidden; }
  .evi-card-back .evi-face img{ width:100%; height:100%; object-fit:cover; }
  .evi-card-back.action-pickable{ cursor:pointer; }
  .evi-card-back.mislead-selected{ box-shadow:0 0 0 3px #7fd4ff, 0 0 18px 6px rgba(127,212,255,.9), var(--shadow-md); }
  /* アシスト中のパートナーはFILEの一番上に、裏面ではなく実際の顔を見せて積む(縁取りは他のFILEカードと同じ白のまま) */
  .assist-face{ width:116px; height:162px; flex:0 0 auto; transform:rotate(-90deg); overflow:hidden; }
  .assist-face img{ width:100%; height:100%; object-fit:cover; }
  .rotate180{ transform:rotate(180deg); }
  .deck-pile-wrap{ position:relative; }
  .card-menu-wrap{ position:relative; flex:0 0 auto; }
  .card-action-menu{ min-width:140px; }
  .card-action-reason{
    font-size:10.5px; line-height:1.4; white-space:normal; max-width:150px;
    background:rgba(20,16,32,.85); color:#ffb3b3; padding:4px 8px; border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .deck-count-badge{ position:absolute; top:-10px; right:-10px; z-index:5; }
  .deck-pile-btn{ cursor:pointer; transition:transform .1s; }
  .deck-pile-btn:hover{ transform:translateY(-3px); box-shadow:0 0 0 3px var(--gold); }
  .deck-menu{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-90deg); z-index:40;
    display:flex; flex-direction:column; gap:6px;
  }
  /* 相手側はさらに180度回転しているので、メニューは逆向き(+90度)で打ち消す */
  .rotate180 .deck-menu{ transform:translate(-50%,-50%) rotate(90deg); }
  /* 枠(白いボード)は敷かず、ボタンだけを後ろのカードの上に浮かせて表示する
     (各ボタン自身の影で、後ろに何が写っていても視認できるようにする) */
  .deck-menu button{
    background:var(--gold); color:#2b2438; border:none; border-radius:16px; width:100%;
    padding:8px 16px; font-weight:800; font-size:12px; cursor:pointer; white-space:nowrap;
    box-shadow:0 3px 10px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.6);
  }
  .deck-menu button:hover{ filter:brightness(1.08); }
  .deck-menu button:disabled{ opacity:.55; cursor:default; filter:none; background:#cfcbe4; }

  .action-log{
    position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:60;
    background:#1b1730; border-radius:16px; padding:14px 18px; width:280px;
    box-shadow:var(--shadow-lg); border:2px solid rgba(255,255,255,.12);
    /* 中身の量によらず、枠のサイズを常に一定にする(足りない分は枠内でスクロール) */
    height:70vh; overflow-y:auto; font-size:12px; line-height:1.9;
  }
  .action-log .entry.current{ color:var(--gold); font-weight:800; }
  .action-log .empty-hint{ opacity:.5; }

  .replay-controls{
    display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 0 0;
  }
  .replay-controls .step-count{ font-size:12px; opacity:.8; min-width:80px; text-align:center; }
</style>

<script>
  // カードデータのability_textは、カードによって改行が\nと\r\nの両方が混在しているため、
  // 行ごとの完全一致・行頭一致で判定する各種パターン検出が\rの有無で失敗しないよう、
  // ここで一括して\nに正規化しておく
  (window.CARD_DATA || []).forEach(c => {
    if (c.ability_text) c.ability_text = c.ability_text.replace(/\r\n/g, '\n');
  });
  const CARD_BY_ID = new Map((window.CARD_DATA || []).map(c => [c.id, c]));
  const INITIAL_HAND_SIZE = 5;

  function cardImage(cardId){
    const c = CARD_BY_ID.get(cardId);
    return c && c.image_url ? `data/images/${c.image_url}` : null;
  }
  function cardName(cardId){
    const c = CARD_BY_ID.get(cardId);
    return c ? c.name : `#${cardId}`;
  }

  // DB側のcolor表記が「青,赤」のようにカンマ区切りの場合と「青赤」のように区切り無しで
  // 連結されている場合が混在している(deckbuilder.htmlと同じ問題)ため、カンマを外した上で
  // 1文字ずつに分解して判定する(色名はすべて漢字1文字)
  const ALL_CARD_COLORS = '青赤黄緑白黒';
  function cardColors(colorText){
    if (!colorText) return [];
    return colorText.replace(/,/g, '').split('').filter(ch => ALL_CARD_COLORS.includes(ch));
  }
  function cardHasColor(cardDef, color){
    return !!cardDef && cardColors(cardDef.color).includes(color);
  }
  // categoryフィールドはカンマ区切りの特徴一覧("探偵,毛利探偵事務所,少年探偵団"等)
  function cardHasTrait(cardDef, trait){
    return !!cardDef && !!cardDef.category && cardDef.category.split(',').includes(trait);
  }

  // カードが〚キーワード〛能力を常時持っているかどうかを判定する。
  // 行頭が【アイコン】の連続、その直後に〚キーワード〛が来る場合だけ「常時持っている」とみなす
  // (「ターン終了時までこのキャラは〚突撃〛を持つ」のような一時的な付与は、キーワードの前に
  // 説明文が入るため行頭にならず、ここでは対象外になる)
  // 【自分ターン中】/【相手ターン中】等の条件付きで、自分の現場にいる(このキャラ以外の)
  // 【色】のキャラ全員をAP＋N する常時能力(1枚につき～のような枚数依存や、コンタクト中
  // だけの一時的なAP変動は対象外。それらは別の仕組みが必要なため未対応)
  function getStaticApBuff(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    for (const line of c.ability_text.split('\n')) {
      if (line.includes('1枚につき') || line.includes('アクション終了時') || line.includes('コンタクト中')) continue;
      const m = line.match(/自分の現場にいる(?:このキャラ以外の)?(?:【([^】]+?)】の)?キャラをAP＋(\d+)する/);
      if (!m) continue;
      let turnCondition = null;
      if (line.includes('【自分ターン中】')) turnCondition = 'self';
      else if (line.includes('【相手ターン中】')) turnCondition = 'opponent';
      return { color: m[1] || null, amount: Number(m[2]), turnCondition };
    }
    return null;
  }

  // 【パートナー(色)】【自分ターン中】AP＋N (自分のパートナーが指定の色で、かつ自分の
  // ターン中だけこのキャラ自身のAPが上がる常時能力)
  function getSelfApBuff(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    for (const line of c.ability_text.split('\n')) {
      const m = line.match(/^【パートナー([^】]+?)】【自分ターン中】AP＋(\d+)$/);
      if (m) return { partnerColor: m[1], amount: Number(m[2]) };
    }
    return null;
  }

  // 現場のキャラの実際のAP(素のAP＋味方の常時バフ)を計算する。stateはmatch
  // (または再生用に組み立てた同形の状態オブジェクト)を渡す
  function effectiveAp(state, instance, ownerSide){
    const c = CARD_BY_ID.get(instance.cardId);
    let ap = c && c.ap != null ? c.ap : 0;
    const side = state[ownerSide];
    const selfBuff = getSelfApBuff(instance.cardId);
    if (selfBuff && side && side.partner && state.turn && state.turn.activeSide === ownerSide
        && cardHasColor(CARD_BY_ID.get(side.partner.cardId), selfBuff.partnerColor)) {
      ap += selfBuff.amount;
    }
    if (!side || !state.turn) return ap;
    side.field.forEach(other => {
      if (other.uid === instance.uid) return;
      const buff = getStaticApBuff(other.cardId);
      if (!buff) return;
      if (buff.turnCondition === 'self' && state.turn.activeSide !== ownerSide) return;
      if (buff.turnCondition === 'opponent' && state.turn.activeSide === ownerSide) return;
      if (buff.color && !cardHasColor(c, buff.color)) return;
      ap += buff.amount;
    });
    // 「キャラを1枚まで選び、ターン終了時までAP＋Nする」等、宣言/登場時効果で
    // 個別に付与した一時的なAPバフ(turnオブジェクトごと作り直されるので自然に消える)
    if (state.turn && state.turn.tempApBuffs) {
      ap += state.turn.tempApBuffs
        .filter(b => b.uid === instance.uid)
        .reduce((sum, b) => sum + b.amount, 0);
    }
    return ap;
  }

  // 〚ミスリードX〛：相手が推理したとき、自分の現場のアクティブ状態の
  // ミスリード持ちキャラをスリープさせることで、推理したパートナー/キャラをLP-Xする
  function getMisleadValue(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    for (const line of c.ability_text.split('\n')) {
      const stripped = line.trim().replace(/^(?:【[^】]*】)+/, '');
      const m = stripped.match(/^〚ミスリード(\d+)〛/);
      if (m) return Number(m[1]);
    }
    return null;
  }

  function hasInnateKeyword(cardDef, keyword){
    if (!cardDef || !cardDef.ability_text) return false;
    return cardDef.ability_text.split('\n').some(line => {
      const stripped = line.trim().replace(/^(?:【[^】]*】)+/, '');
      return stripped.startsWith(`〚${keyword}〛`);
    });
  }
  // 常時持っているキーワードに加えて、「ターン終了時まで〚キーワード〛を与える」等で
  // 一時的に付与されたキーワードも含めて判定する
  function charHasKeyword(instance, keyword){
    if (hasInnateKeyword(CARD_BY_ID.get(instance.cardId), keyword)) return true;
    return !!(match.turn && match.turn.tempKeywords
      && match.turn.tempKeywords.some(k => k.uid === instance.uid && k.keyword === keyword));
  }

  // 事件カードは横向きの絵柄がほとんどだが縦向きのものもあるため、縦向きの場合は
  // 同じ画像をぼかして左右の余白を埋める(deckbuilder.htmlと同じ手法)
  function caseArtHtml(cardId){
    const img = cardImage(cardId);
    const name = cardName(cardId);
    if (!img) return name;
    return `<img class="blur-bg" src="${img}" alt="" aria-hidden="true"><img class="fg-img" src="${img}" alt="${name}">`;
  }

  function shuffled(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // savedDeck.cards: [{id, qty}] はキャラ・イベントのみ(40枚)。パートナー/事件は
  // savedDeck.partnerCardId / caseCardId に別枠で保存されている(deckbuilder.html参照)。
  // 未対応の旧形式デッキ(このフィールドが無い)は、cards内から種別で自動検出してフォールバックする。
  function splitDeck(savedDeck){
    const expanded = [];
    savedDeck.cards.forEach(c => { for (let i = 0; i < c.qty; i++) expanded.push(c.id); });

    let partnerCardId = savedDeck.partnerCardId ?? null;
    let caseCardId = savedDeck.caseCardId ?? null;
    const rest = [];
    expanded.forEach(id => {
      const card = CARD_BY_ID.get(id);
      if (partnerCardId == null && card && card.card_type === 'パートナー') { partnerCardId = id; return; }
      if (caseCardId == null && card && card.card_type === '事件') { caseCardId = id; return; }
      rest.push(id);
    });

    return { deckName: savedDeck.name, partnerCardId, caseCardId, deckOrder: shuffled(rest) };
  }

  // side設定({deckName, partnerCardId, caseCardId, deckOrder}) から、初期5枚ドロー済みの対戦状態を作る
  function buildSideState(sideKey, config){
    const deckPile = config.deckOrder.map((cardId, i) => ({ cardId, uid: `${sideKey}-${i}` }));
    const hand = deckPile.splice(0, INITIAL_HAND_SIZE);
    return {
      deckName: config.deckName,
      partner: config.partnerCardId != null ? { cardId: config.partnerCardId, uid: `${sideKey}-partner`, sleeping: false, assisting: false } : null,
      case: config.caseCardId != null ? { cardId: config.caseCardId, uid: `${sideKey}-case`, resolved: false } : null,
      deckPile,
      hand,
      field: [],
      file: [],
      evidence: [],
      remove: [],
    };
  }

  // ---- グローバル対戦状態 ----
  let match = null;      // { self, opponent, config:{self,opponent}, events:[] }
  let replayMode = false;
  let replayPointer = 0; // 次に適用するevents[]のインデックス(replay時)
  let replayTimer = null;
  let replayAutoPlaying = false;
  let replayAnimating = false;

  function applyEvent(state, ev){
    const side = state[ev.side];
    if (ev.type === 'draw') {
      const card = side.deckPile.shift();
      if (card) side.hand.push(card);
    } else if (ev.type === 'play') {
      const idx = side.hand.findIndex(c => c.uid === ev.uid);
      if (idx !== -1) {
        const card = side.hand.splice(idx, 1)[0];
        const cardDef = CARD_BY_ID.get(card.cardId);
        if (cardDef && cardDef.card_type === 'イベント') {
          // イベントは現場に出ず、効果を解決してリムーブエリアへ
          side.remove.push(card);
        } else {
          card.sleeping = false;
          card.justEntered = true; // 名乗り状態：登場したターンは推理・アクションに制限あり(〚迅速〛〚突撃〛で解除)
          side.field.push(card);
        }
      }
    } else if (ev.type === 'mulligan') {
      side.hand = side.hand.filter(c => !ev.returnedUids.includes(c.uid));
      side.deckPile = ev.resultDeck.map(c => ({ ...c }));
      const drawn = side.deckPile.splice(0, ev.returnedUids.length);
      side.hand.push(...drawn);
    } else if (ev.type === 'addFile') {
      const card = side.deckPile.shift();
      if (card) side.file.push(card);
    } else if (ev.type === 'addEvidence') {
      const card = side.deckPile.shift();
      if (card) side.evidence.push(card);
    } else if (ev.type === 'evidenceFlip') {
      const card = side.evidence.find(c => c.uid === ev.uid);
      if (card) card.faceUp = ev.faceUp;
    } else if (ev.type === 'nextHintDraw') {
      // ネクストヒント①：FILEエリアの1番上(=最後に置かれた)カードを手札に加える
      const card = side.file.pop();
      if (card) side.hand.push(card);
    } else if (ev.type === 'reason') {
      const target = ev.targetType === 'partner' ? side.partner : side.field.find(c => c.uid === ev.uid);
      if (!target || target.sleeping) return;
      target.sleeping = true;
      const c = CARD_BY_ID.get(target.cardId);
      let baseLp = c && c.lp != null ? c.lp : 0;
      // 「ターン終了時までLP＋N」等の一時バフを反映
      if (state.turn && state.turn.tempLpBuffs) {
        baseLp += state.turn.tempLpBuffs.filter(b => b.uid === target.uid).reduce((s, b) => s + b.amount, 0);
      }
      // 〚ミスリードX〛：相手が使用した分だけ、この推理で得るLPが下がる(0未満にはならない)
      const lp = Math.max(0, baseLp - (ev.lpReduction || 0));
      const n = Math.max(0, Math.min(lp, side.deckPile.length));
      side.evidence.push(...side.deckPile.splice(0, n));
    } else if (ev.type === 'misleadSleep') {
      // ミスリード使用：宣言したキャラをスリープさせる(LP減少自体はreasonイベント側で処理済み)
      const c = side.field.find(fc => fc.uid === ev.uid);
      if (c) c.sleeping = true;
    } else if (ev.type === 'deckPeekChoose') {
      // デッキの上から見た中の1枚を、実際に手札(または現場にスリープ状態で)に加える
      // (選ばなかった場合は呼ばれない)
      const idx = side.deckPile.findIndex(c => c.uid === ev.chosenUid);
      if (idx !== -1) {
        const card = side.deckPile.splice(idx, 1)[0];
        if (ev.destination === 'fieldSleeping') {
          card.sleeping = true;
          card.justEntered = true;
          side.field.push(card);
        } else {
          side.hand.push(card);
        }
      }
    } else if (ev.type === 'deckPeekRemove') {
      // 上のカードを手札に加えたことで発生する、手札から1枚リムーブする処理
      const idx = side.hand.findIndex(c => c.uid === ev.removedHandUid);
      if (idx !== -1) side.remove.push(side.hand.splice(idx, 1)[0]);
    } else if (ev.type === 'deckPeekReorder') {
      // 選ばなかった残りのカードを、指定された(プレイヤーが選んだ)順番でデッキの下に戻す
      const remaining = ev.remainingOrder.map(uid => side.deckPile.find(c => c.uid === uid)).filter(Boolean);
      side.deckPile = side.deckPile.filter(c => !ev.remainingOrder.includes(c.uid));
      side.deckPile.push(...remaining);
    } else if (ev.type === 'partnerHandRemove') {
      // 【パートナー(色)】【登場時】手札を1枚リムーブする(選んだ時点で実際に移す)
      const idx = side.hand.findIndex(c => c.uid === ev.removedHandUid);
      if (idx !== -1) side.remove.push(side.hand.splice(idx, 1)[0]);
    } else if (ev.type === 'partnerFieldRemove') {
      // 上の手札リムーブ(または相手への証拠付与)に続けて、AP/レベル以下のキャラを
      // 1枚まで選び(自分・相手どちらでも)リムーブする
      if (ev.targetSide && ev.targetUid) {
        const targetState = state[ev.targetSide];
        const tIdx = targetState.field.findIndex(c => c.uid === ev.targetUid);
        if (tIdx !== -1) targetState.remove.push(targetState.field.splice(tIdx, 1)[0]);
        if (ev.giveEvidence) {
          const oppSide = ev.side === 'self' ? 'opponent' : 'self';
          const oppState = state[oppSide];
          if (oppState.deckPile.length > 0) oppState.evidence.push(oppState.deckPile.shift());
        }
      }
    } else if (ev.type === 'turnStart') {
      // オートフェイズ①②：自分のパートナーと現場のキャラをすべてアクティブにする
      // (アシストでFILEエリアに置かれていた場合はパートナーエリアに戻してアクティブにする。
      // スタン状態のキャラは、アクティブにする代わりにスリープにする)
      if (side.partner) { side.partner.sleeping = false; side.partner.assisting = false; }
      side.field.forEach(c => {
        c.sleeping = !!c.stunned;
        c.stunned = false;
        c.justEntered = false;
      });
    } else if (ev.type === 'assist') {
      // アシスト：パートナーをスリープさせ、FILEエリアに移動させる
      // (ここにいる間はFILEエリアの枚数として数える)
      if (side.partner && !side.partner.sleeping) {
        side.partner.sleeping = true;
        side.partner.assisting = true;
        // FILEエリアが(アシスト中のこのパートナーも含めて)7枚以上なら事件は解決編になる
        // (満たしたら必ず移行。一度解決編になったら事件編には戻らない)
        if (side.case && !side.case.resolved && side.file.length + 1 >= 7) {
          side.case.resolved = true;
        }
      }
    } else if (ev.type === 'solveCase') {
      // 事件解決：パートナーをスリープさせる(勝敗の判定・表示はUI側で行う)
      if (side.partner) side.partner.sleeping = true;
    } else if (ev.type === 'solveCaseEvidenceMill') {
      // 書き換えられた事件解決：パートナーをスリープさせ、証拠を事件レベルの数だけ
      // リムーブする(勝敗の判定・表示はUI側で行う)
      if (side.partner) side.partner.sleeping = true;
      const n = Math.min(ev.count, side.evidence.length);
      side.remove.push(...side.evidence.splice(side.evidence.length - n, n));
    } else if (ev.type === 'actionDeclare') {
      // アクション宣言：対象を指定し、アクションするキャラをスリープさせる
      const actor = side.field.find(c => c.uid === ev.actorUid);
      if (actor) actor.sleeping = true;
    } else if (ev.type === 'actionResolve') {
      // ガード判定後のコンタクト：AP比較で負けた方(常にディフェンダー側)がリムーブされる
      // (immuneUidsに含まれる場合は変装時能力等でリムーブされない)。事件が対象で
      // ガードされなかった場合だけはコンタクトが発生せず、証拠のリムーブ／獲得処理になる
      const targetState = state[ev.targetSide];
      if (ev.guardUid) {
        const guard = targetState.field.find(c => c.uid === ev.guardUid);
        if (guard) guard.sleeping = true;
      }
      if (!ev.guardUid && ev.targetType === 'case') {
        // アクション［事件］がガードされなかった場合：相手の一番上(=最後に得た)証拠を
        // リムーブし、自分は証拠を1つ得る(ヒラメキの発動選択は未実装)
        if (targetState.evidence.length > 0) targetState.remove.push(targetState.evidence.pop());
        if (side.deckPile.length > 0) side.evidence.push(side.deckPile.shift());
      } else {
        const defenderUid = ev.guardUid || ev.targetUid;
        const actor = side.field.find(c => c.uid === ev.actorUid);
        const defenderIdx = targetState.field.findIndex(c => c.uid === defenderUid);
        if (actor && defenderIdx !== -1) {
          const defender = targetState.field[defenderIdx];
          const cutInBonus = (sideKey) => (ev.cutInBuffs || []).filter(b => b.side === sideKey).reduce((s, b) => s + b.amount, 0);
          const actorAp = effectiveAp(state, actor, ev.side) + cutInBonus(ev.side);
          const defenderAp = effectiveAp(state, defender, ev.targetSide) + cutInBonus(ev.targetSide);
          if (actorAp >= defenderAp && !(ev.immuneUids || []).includes(defenderUid)) {
            targetState.remove.push(targetState.field.splice(defenderIdx, 1)[0]);
          }
        }
      }
    } else if (ev.type === 'cutInUse') {
      // カットイン：手札から使用し、使用後リムーブエリアへ(AP上昇はactionResolve側で加味)
      const idx = side.hand.findIndex(c => c.uid === ev.uid);
      if (idx !== -1) side.remove.push(side.hand.splice(idx, 1)[0]);
    } else if (ev.type === 'disguiseSwap') {
      // 変装：uidは変えずにcardIdだけ差し替える(スリープ状態や一時効果をそのまま引き継ぐため)。
      // 元のキャラは裏向きでデッキの下に移る
      side.hand = side.hand.filter(c => c.uid !== ev.handUid);
      const target = side.field.find(c => c.uid === ev.uid);
      if (target) target.cardId = ev.newCardId;
      side.deckPile.push({ uid: ev.deckCardUid, cardId: ev.oldCardId });
    } else if (ev.type === 'fieldRemoveTrigger') {
      // 【現場リムーブ時】の単純な効果(選択が不要なもの)をまとめて処理する
      if (ev.effectType === 'draw') {
        const card = side.deckPile.shift();
        if (card) side.hand.push(card);
      } else if (ev.effectType === 'handRemoveByUid') {
        const idx = side.hand.findIndex(c => c.uid === ev.uid);
        if (idx !== -1) side.remove.push(side.hand.splice(idx, 1)[0]);
      }
    } else if (ev.type === 'declareSleepCost') {
      // 【宣言】【スリープ】：コストとしてこのキャラをスリープさせる
      const actor = side.field.find(c => c.uid === ev.uid);
      if (actor) actor.sleeping = true;
    } else if (ev.type === 'apBuffApply') {
      // 「キャラを1枚まで選び、ターン終了時までAP＋Nする」：turn.tempApBuffsに積む
      // (turnオブジェクトごと作り直されるので、次のターンには自然に消える)
      if (state.turn) state.turn.tempApBuffs.push({ uid: ev.targetUid, amount: ev.amount });
    } else if (ev.type === 'lpBuffApply') {
      // 「ターン終了時までLP＋Nする」：turn.tempLpBuffsに積む
      if (state.turn) state.turn.tempLpBuffs.push({ uid: ev.targetUid, amount: ev.amount });
    } else if (ev.type === 'tempKeywordGrant') {
      // 「ターン終了時まで〚キーワード〛を与える」：turn.tempKeywordsに積む
      if (state.turn) state.turn.tempKeywords.push({ uid: ev.targetUid, keyword: ev.keyword });
    } else if (ev.type === 'boardWipe') {
      // 「すべてのキャラをリムーブする」：自分・相手の現場のキャラを全員リムーブエリアへ
      ['self', 'opponent'].forEach(sk => {
        const s = state[sk];
        s.remove.push(...s.field);
        s.field = [];
      });
    } else if (ev.type === 'fileToHand') {
      // FILEエリアの一番上(=最後に置かれた)カードを手札に加える
      const card = side.file.pop();
      if (card) side.hand.push(card);
    } else if (ev.type === 'millSelf') {
      // 自分のデッキの上からN枚をリムーブする
      const n = Math.min(ev.count, side.deckPile.length);
      side.remove.push(...side.deckPile.splice(0, n));
    } else if (ev.type === 'declareSleepTarget') {
      // 【宣言】コスト：〚このキャラ以外のキャラを1枚スリープさせる〛
      const c = side.field.find(fc => fc.uid === ev.uid);
      if (c) c.sleeping = true;
    } else if (ev.type === 'handDiscard') {
      // 「カードを引き、手札をリムーブする」の、手札から直接選んでリムーブする側
      const idx = side.hand.findIndex(c => c.uid === ev.uid);
      if (idx !== -1) side.remove.push(side.hand.splice(idx, 1)[0]);
    } else if (ev.type === 'selfRemoveCost') {
      // 【宣言】コスト：〚リムーブエリアに移す〛(このキャラ自身をリムーブする)
      const idx = side.field.findIndex(c => c.uid === ev.uid);
      if (idx !== -1) side.remove.push(side.field.splice(idx, 1)[0]);
    } else if (ev.type === 'removeEventToHand') {
      // リムーブエリアにある指定のカードを手札に加える(選ばなかった場合は呼ばれない)
      if (!ev.uid) return;
      const idx = side.remove.findIndex(c => c.uid === ev.uid);
      if (idx !== -1) side.hand.push(side.remove.splice(idx, 1)[0]);
    } else if (ev.type === 'switchRemove') {
      // スイッチ：現場が埋まっている場合に、新しいキャラを出す前に選んだ1枚をリムーブする
      const idx = side.field.findIndex(c => c.uid === ev.uid);
      if (idx !== -1) side.remove.push(side.field.splice(idx, 1)[0]);
    } else if (ev.type === 'selfToDeckBottomCost') {
      // 【宣言】コスト：〚デッキの下に移す〛(このキャラ自身をデッキの一番下に戻す)
      const idx = side.field.findIndex(c => c.uid === ev.uid);
      if (idx !== -1) side.deckPile.push(side.field.splice(idx, 1)[0]);
    }
  }

  function recordEvent(ev){
    match.events.push(ev);
    applyEvent(match, ev);
    renderBoard(match);
    renderLog();
  }

  // デッキから何かを移動させる系のアクション(ドロー/FILE追加/証拠追加)で、
  // 実際にデッキの位置から移動先まで裏向きのカードが飛んでいくのが見えるようにする。
  // .table(回転中)の外(document.body直下)に一時的なゴースト要素を置くので、
  // 現場に出す時のアニメーションと違いローカル座標変換は不要(素直に画面座標で動かせる)
  // fromEl の位置から toEl の位置・サイズまで飛ばす(縦向き⇔横向きの変化は
  // width/heightを直接変えて表現し、rotate()は使わない)。
  // toElは飛んでいる間隠しておき、着地と同時に表示することで、実物と幽霊が
  // 二重に見えてしまわないようにする
  // 要素の「画面上の実際の向き」を、祖先要素の transform も含めて測定する
  // (盤面全体が90度回転している上に、相手側はさらに180度回転しているため、
  // 要素自身のtransformだけでは画面上の本当の向きは分からない)
  // elとその祖先すべてのtransformを合成した行列を返す(盤面全体が90度回転している上に、
  // 相手側はさらに180度回転しているため、要素自身や.tableだけのtransformでは
  // 画面上の本当の向き・移動量はわからない)
  function getScreenTransformMatrix(el){
    let matrix = new DOMMatrix();
    let node = el;
    while (node && node !== document.body) {
      const t = getComputedStyle(node).transform;
      if (t && t !== 'none') matrix = new DOMMatrix(t).multiply(matrix);
      node = node.parentElement;
    }
    return matrix;
  }

  function getScreenRotationDeg(el){
    const matrix = getScreenTransformMatrix(el);
    return Math.atan2(matrix.b, matrix.a) * 180 / Math.PI;
  }

  // getBoundingClientRect()は画面上に投影された(回転済みの)見た目のサイズを
  // 返すため、そこにさらに回転をかけると向きが二重に適用されてズレてしまう。
  // deg分の回転を打ち消して、カード本来の(回転前の)サイズを逆算する
  function unrotatedSize(rect, deg){
    const swapped = Math.round((((deg % 180) + 180) % 180) / 90) === 1;
    return swapped ? { width: rect.height, height: rect.width } : { width: rect.width, height: rect.height };
  }

  // fromEl自身が消える(再描画で消滅する)ような移動の場合、事前に
  // snapshotCardPosition()で位置・向きを取っておき、それをfromElの代わりに渡せる
  function snapshotCardPosition(el){
    // 手札のカードは扇状に開くための小さな傾き(±数度〜二十数度)が乗っているため、
    // そのままだとゴーストの回転アニメーションに余計な傾きが混ざってしまう。
    // 90度単位に丸めて「カード本来の向き」だけを使う
    const rawDeg = getScreenRotationDeg(el);
    return {
      rect: el.getBoundingClientRect(),
      deg: Math.round(rawDeg / 90) * 90,
      zoneSide: el.closest('.zone')?.dataset.side,
    };
  }

  // アクション宣言中、アクションしたキャラ→対象のキャラへ光るビームを表示する
  function clearActionArrow(){
    const svg = document.getElementById('actionArrowLayer');
    if (!svg) return;
    svg.querySelectorAll('.action-arrow-group').forEach(g => g.remove());
  }

  function drawActionArrow(fromEl, toEl){
    const svg = document.getElementById('actionArrowLayer');
    if (!svg || !fromEl || !toEl) return;
    clearActionArrow();
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    const x1 = fromRect.left + fromRect.width / 2, y1 = fromRect.top + fromRect.height / 2;
    const x2 = toRect.left + toRect.width / 2, y2 = toRect.top + toRect.height / 2;
    const ns = 'http://www.w3.org/2000/svg';
    const gradId = 'actionArrowGrad-' + Date.now();

    const group = document.createElementNS(ns, 'g');
    group.setAttribute('class', 'action-arrow-group');

    const grad = document.createElementNS(ns, 'linearGradient');
    grad.setAttribute('id', gradId);
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    grad.setAttribute('x1', x1); grad.setAttribute('y1', y1);
    grad.setAttribute('x2', x2); grad.setAttribute('y2', y2);
    grad.innerHTML = `
      <stop offset="0%" stop-color="#8fe3ff" stop-opacity="0"></stop>
      <stop offset="30%" stop-color="#8fe3ff" stop-opacity=".95"></stop>
      <stop offset="100%" stop-color="#fff6cf" stop-opacity="1"></stop>
    `;
    group.appendChild(grad);

    const length = Math.hypot(x2 - x1, y2 - y1) || 1;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', `url(#${gradId})`);
    line.setAttribute('stroke-width', '9');
    line.setAttribute('filter', 'url(#actionArrowGlow)');
    line.setAttribute('class', 'action-arrow-line');
    line.style.strokeDasharray = String(length);
    line.style.strokeDashoffset = String(length);
    group.appendChild(line);

    svg.appendChild(group);
    void line.getBoundingClientRect(); // 初期状態を確定させてから遷移させる
    line.classList.add('show');
    line.style.strokeDashoffset = '0';
  }

  function flyGhostCard(fromEl, toEl, faceImageUrl){
    if (!fromEl || !toEl) return;
    const fromIsSnapshot = !(fromEl instanceof Element);
    const fromRect = fromIsSnapshot ? fromEl.rect : fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    if (fromRect.width === 0 || toRect.width === 0) return;
    // ゴーストは盤面の外(document.body直下)に置くため、盤面自体の回転を
    // 引き継げない。実際のデッキ/着地先の「画面上の向き」を測定して、
    // ゴーストの絵柄がそれぞれと同じ向きに見えるようにする。
    // FILE/証拠の裏面は、実際の画像の向きは内側の.back-imgが持っているので
    // そちらを測定対象にする
    const fromDeg = fromIsSnapshot ? fromEl.deg : getScreenRotationDeg(fromEl);
    let toDeg = getScreenRotationDeg(toEl.querySelector('.back-img, .assist-face') || toEl);
    // 相手側(画面右)は回転の向きを逆にする(360度分ずらして反対回りにする)。
    // ただし向きが変わらない(diffが0)場合にまで適用すると、実際には回転不要なのに
    // 丸ごと1周回転してしまうので、その場合は適用しない
    const zoneSide = fromIsSnapshot ? fromEl.zoneSide : fromEl.closest('.zone')?.dataset.side;
    if (zoneSide === 'opponent') {
      const diff = toDeg - fromDeg;
      if (diff !== 0) toDeg = fromDeg + (diff > 0 ? diff - 360 : diff + 360);
    }
    const size = unrotatedSize(fromRect, fromDeg); // fromとtoは同じ寸法のはず
    toEl.style.visibility = 'hidden';
    const ghost = document.createElement('div');
    ghost.className = 'card-fly-ghost';
    Object.assign(ghost.style, {
      position: 'fixed',
      left: (fromRect.left + fromRect.width / 2) + 'px',
      top: (fromRect.top + fromRect.height / 2) + 'px',
      width: size.width + 'px', height: size.height + 'px',
      transform: `translate(-50%, -50%) rotate(${fromDeg}deg)`,
    });
    // パートナーのアシストなど、裏面ではなく実際のカード面を見せたい場合に使う
    if (faceImageUrl) ghost.style.backgroundImage = `url('${faceImageUrl}')`;
    document.body.appendChild(ghost);
    void ghost.offsetWidth; // 初期状態を確定させてから遷移させる
    ghost.style.transition = 'left .3s linear, top .3s linear, transform .3s linear';
    ghost.style.left = (toRect.left + toRect.width / 2) + 'px';
    ghost.style.top = (toRect.top + toRect.height / 2) + 'px';
    ghost.style.transform = `translate(-50%, -50%) rotate(${toDeg}deg)`;
    setTimeout(() => {
      toEl.style.visibility = '';
      ghost.remove();
    }, 300);
  }

  // ドロー専用の演出：デッキの位置から自分の手札側(自分=左なら左、相手=右なら右)へ
  // まっすぐずれながらフェードアウトし、手札側はフェードインで現れる
  function fadeDrawCard(fromEl, toEl){
    if (!fromEl) return;
    // flyGhostCardと同様、再描画で消えてしまう要素からの移動はsnapshotCardPosition()の
    // スナップショット(Elementではなくrect/zoneSideを持つ普通のオブジェクト)を渡せる
    const fromIsSnapshot = !(fromEl instanceof Element);
    const fromRect = fromIsSnapshot ? fromEl.rect : fromEl.getBoundingClientRect();
    if (fromRect.width === 0) return;
    const zoneSide = fromIsSnapshot ? fromEl.zoneSide : fromEl.closest('.zone')?.dataset.side;
    const dx = zoneSide === 'opponent' ? 32 : -32;
    const ghost = document.createElement('div');
    ghost.className = 'card-fly-ghost';
    Object.assign(ghost.style, {
      position: 'fixed',
      left: fromRect.left + 'px', top: fromRect.top + 'px',
      width: fromRect.width + 'px', height: fromRect.height + 'px',
      opacity: '1', transform: 'translateX(0px)',
    });
    document.body.appendChild(ghost);
    void ghost.offsetWidth; // 初期状態を確定させてから遷移させる
    ghost.style.transition = 'transform .28s ease, opacity .28s ease';
    ghost.style.transform = `translateX(${dx}px)`;
    ghost.style.opacity = '0';
    setTimeout(() => ghost.remove(), 300);

    if (toEl) {
      // 手札側も同じ方向から滑り込みながらフェードインする
      // (自分=左なら左から右へ、相手=右なら右から左へ)
      const finalTransform = toEl.style.transform || '';
      const dxIn = zoneSide === 'opponent' ? 32 : -32;
      toEl.style.transition = 'none';
      toEl.style.opacity = '0';
      toEl.style.transform = `translateX(${dxIn}px) ${finalTransform}`;
      void toEl.offsetWidth;
      requestAnimationFrame(() => {
        toEl.style.transition = 'opacity .28s ease, transform .28s ease';
        toEl.style.opacity = '1';
        toEl.style.transform = finalTransform;
      });
      setTimeout(() => {
        toEl.style.transition = '';
        toEl.style.opacity = '';
        toEl.style.transform = finalTransform;
      }, 320);
    }
  }

  function drawCard(side){
    if (replayMode || mulliganPhase) return;
    if (match[side].deckPile.length === 0) return;
    const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
    recordEvent({ type: 'draw', side });
    const handRow = document.querySelector(`.zone[data-side="${side}"] .hand-row`);
    const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
    fadeDrawCard(deckEl, lastCard);
  }

  function addToFile(side){
    if (replayMode || mulliganPhase) return;
    if (match[side].deckPile.length === 0) return;
    const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
    recordEvent({ type: 'addFile', side });
    const stack = document.querySelector(`.zone[data-side="${side}"] .file-stack`);
    const lastCardBack = stack ? stack.querySelector('.file-card-back:last-child') : null;
    if (lastCardBack) flyGhostCard(deckEl, lastCardBack);
  }

  function addToEvidence(side){
    if (replayMode || mulliganPhase) return;
    if (match[side].deckPile.length === 0) return;
    const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
    recordEvent({ type: 'addEvidence', side });
    const stack = document.querySelector(`.zone[data-side="${side}"] .evidence-stack`);
    const lastCardBack = stack ? stack.querySelector('.evi-card-back:last-child') : null;
    if (lastCardBack) flyGhostCard(deckEl, lastCardBack);
  }

  // ---- ターン進行(オートフェイズ→メインフェイズ→エンドフェイズ) ----
  // match.turn: { activeSide, turnNumber, phase:'auto'|'main'|'end' }
  const AUTO_PHASE_STEP_MS = 420; // ドロー/FILE追加の演出が重ならないよう1手ずつ間隔をあける

  function startTurn(side, turnNumber, isFirstTurn){
    // アシスト中だった場合、パートナーエリアに戻るアニメーションを出すため、
    // turnStartイベントで状態が書き換わる(=FILE側の表示が消える)前に位置を控えておく
    const wasAssisting = !!(match[side].partner && match[side].partner.assisting);
    let assistSnapshot = null, partnerImg = null;
    if (wasAssisting) {
      const fromEl = document.querySelector(`.zone[data-side="${side}"] .file-stack .assist-file-card`);
      if (fromEl) assistSnapshot = snapshotCardPosition(fromEl);
      partnerImg = cardImage(match[side].partner.cardId);
    }
    match.turn = {
      activeSide: side, turnNumber, phase: 'auto',
      playedCardThisTurn: false, nextHintUsedThisTurn: false, nextHintPending: false,
      tempApBuffs: [], // 「ターン終了時まで」のAPバフ。turnオブジェクトごと作り直すので自然に消える
      tempLpBuffs: [], // 「ターン終了時まで」のLPバフ。同上
      tempKeywords: [], // 「ターン終了時まで」〚キーワード〛を付与する効果。同上
      declaredAbilityUids: [], // 【ターン1】の宣言能力を今ターンすでに使ったキャラのuid
      nextHintBlocked: false, // 「このターン中、自分はネクストヒントできない」効果
    };
    recordEvent({ type: 'turnStart', side, turnNumber, isFirstTurn });
    renderTurnBar();
    if (assistSnapshot) {
      const toEl = document.querySelector(`.zone[data-side="${side}"] .partner-slot`);
      if (toEl) flyGhostCard(assistSnapshot, toEl, partnerImg);
    }
    runAutoPhase(side, isFirstTurn);
  }

  function runAutoPhase(side, isFirstTurn){
    // ①パートナー・現場のアクティブ化はturnStartイベントで反映済み
    // ②③ドロー1枚＋FILEエリアに2枚(先攻1ターン目のみ1枚)を、1手ずつ間隔をあけて実行
    const fileCount = isFirstTurn ? 1 : 2;
    const steps = [() => drawCard(side)];
    for (let i = 0; i < fileCount; i++) steps.push(() => addToFile(side));
    let i = 0;
    const runNext = () => {
      if (i >= steps.length) {
        match.turn.phase = 'main';
        renderTurnBar();
        renderBoard(match); // 手札の使用可否・ネクストヒントの可否ボタンをメインフェイズ状態で再評価する
        return;
      }
      steps[i++]();
      setTimeout(runNext, AUTO_PHASE_STEP_MS);
    };
    runNext();
  }

  function endTurn(){
    if (replayMode || mulliganPhase) return;
    if (!match.turn || match.turn.phase !== 'main' || actionState || apBuffState || misleadState || handDiscardState || bonusEvidenceState || sleepCostState || lpBuffChoiceState || contactState || oppHandPickState || freePlayChoiceState || actionEndSwapState || keywordGrantChoiceState || evidencePickState || switchState) return;
    const next = match.turn.activeSide === 'self' ? 'opponent' : 'self';
    startTurn(next, match.turn.turnNumber + 1, false);
  }

  function renderTurnBar(){
    const bar = document.getElementById('turnBar');
    if (!bar) return;
    if (!match || !match.turn || replayMode) {
      bar.style.display = 'none';
      document.querySelectorAll('.zone').forEach(z => z.classList.remove('inactive-turn'));
      return;
    }
    bar.style.display = 'flex';
    const { activeSide, turnNumber, phase } = match.turn;
    const phaseLabel = phase === 'auto' ? 'オートフェイズ' : phase === 'main' ? 'メインフェイズ' : 'エンドフェイズ';
    // ネクストヒントで手札に加えた1枚を登場させるかどうかは任意なので、
    // 何もせずそのままターンを終了させてもよい(専用のスキップ操作は用意しない)
    bar.innerHTML = `
      <span class="turn-label ${activeSide}">ターン${turnNumber}</span>
      <span class="phase-label">${phaseLabel}</span>
      <button class="btn" id="endTurnBtn"${phase === 'main' && !actionState && !apBuffState && !misleadState && !handDiscardState && !bonusEvidenceState && !sleepCostState && !lpBuffChoiceState && !contactState && !oppHandPickState && !freePlayChoiceState && !actionEndSwapState && !keywordGrantChoiceState && !evidencePickState && !switchState ? '' : ' disabled'}>ターン終了</button>
    `;
    document.getElementById('endTurnBtn').onclick = endTurn;

    // 相手番か自分番かひと目でわかるよう、手番でない側のゾーンを少し暗くする。
    // ただしアクションの対象選択中は、選べるキャラが暗くて見えづらくならないよう
    // 対象側のゾーンの暗さを一時的に解除する
    document.querySelectorAll('.zone').forEach(z => {
      const suppressDim = (actionState && actionState.step === 'target' && z.dataset.side === actionState.oppSide) || !!apBuffState
        || (misleadState && z.dataset.side === misleadState.oppSide) || !!sleepCostState
        || (contactState && z.dataset.side === contactState.queue[0]) || !!keywordGrantChoiceState || !!evidencePickState || !!switchState;
      z.classList.toggle('inactive-turn', z.dataset.side !== activeSide && !suppressDim);
    });
  }

  // 推理が可能か判定する(アクティブ状態のみ。名乗り状態は〚迅速〛がなければ不可。
  // パートナーは登場ターンという概念がないので対象外)
  function canUseReason(side, targetType, uid){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const s = match[side];
    const target = targetType === 'partner' ? s.partner : s.field.find(c => c.uid === uid);
    if (!target) return { ok: false, reason: '' };
    if (target.sleeping) return { ok: false, reason: 'スリープ状態では行えません' };
    if (targetType !== 'partner' && target.justEntered && !charHasKeyword(target, '迅速')) {
      return { ok: false, reason: '名乗り状態では行えません' };
    }
    return { ok: true, reason: '' };
  }

  // 推理：スリープ状態にして、LPの数だけ証拠を得る(アクティブ状態でのみ可能)。
  // 相手にミスリード持ちのアクティブなキャラがいる場合は、先にミスリード使用の
  // 判断を挟む(何枚でも同時使用可、使わなくてもよい)
  function performReason(side, targetType, uid){
    if (!canUseReason(side, targetType, uid).ok) return;
    const oppSide = side === 'self' ? 'opponent' : 'self';
    const misleadCandidates = match[oppSide].field.filter(c => !c.sleeping && getMisleadValue(c.cardId) != null);
    if (misleadCandidates.length > 0) {
      misleadState = { side, targetType, uid, oppSide, selectedUids: [] };
      renderBoard(match);
      renderPickHint();
      return;
    }
    resolveReason(side, targetType, uid, 0);
  }

  function resolveReason(side, targetType, uid, lpReduction){
    const s = match[side];
    const target = targetType === 'partner' ? s.partner : s.field.find(c => c.uid === uid);
    if (!target || target.sleeping) return;
    const c = CARD_BY_ID.get(target.cardId);
    const lp = Math.max(0, (c && c.lp != null ? c.lp : 0) - lpReduction);
    const gainCount = Math.max(0, Math.min(lp, s.deckPile.length));
    const oldEvidenceCount = s.evidence.length;
    const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
    recordEvent({ type: 'reason', side, targetType, uid: targetType === 'partner' ? target.uid : uid, lpReduction });
    // デッキから証拠エリアに移動するカードが、得た枚数だけ1枚ずつ間隔をあけて飛んでいくようにする
    if (gainCount > 0) {
      const stack = document.querySelector(`.zone[data-side="${side}"] .evidence-stack`);
      const backs = stack ? Array.from(stack.querySelectorAll('.evi-card-back')) : [];
      // 2枚以上同時に得る場合でも、再描画で全部いっぺんに見えてしまわないよう、
      // 新しく増えた分はいったん全部隠しておき、1枚ずつ順番にめくって見せる
      // (flyGhostCardは飛んでいる間だけtoElを隠し、着地と同時に表示し直す)
      for (let k = 0; k < gainCount; k++) {
        const el = backs[oldEvidenceCount + k];
        if (el) el.style.visibility = 'hidden';
      }
      let i = 0;
      const flyNext = () => {
        if (i >= gainCount) return;
        const toEl = backs[oldEvidenceCount + i];
        i++;
        if (toEl) flyGhostCard(deckEl, toEl);
        if (i < gainCount) setTimeout(flyNext, AUTO_PHASE_STEP_MS);
      };
      flyNext();
    }
  }

  // ミスリード：相手の推理に対して、自分の現場のアクティブ状態のミスリード持ちキャラを
  // 何枚でも選んでスリープさせられる(選んだ分だけ合計でLP-Xされる)
  let misleadState = null; // { side(推理した側), targetType, uid, oppSide(ミスリードを使う側), selectedUids }
  function toggleMisleadSelect(uid){
    if (!misleadState) return;
    const idx = misleadState.selectedUids.indexOf(uid);
    if (idx === -1) misleadState.selectedUids.push(uid); else misleadState.selectedUids.splice(idx, 1);
    renderBoard(match);
    renderPickHint();
  }
  function confirmMislead(){
    if (!misleadState) return;
    const { side, targetType, uid, oppSide, selectedUids } = misleadState;
    let lpReduction = 0;
    selectedUids.forEach(u => {
      const c = match[oppSide].field.find(fc => fc.uid === u);
      if (!c) return;
      lpReduction += getMisleadValue(c.cardId) || 0;
      recordEvent({ type: 'misleadSleep', side: oppSide, uid: u });
    });
    misleadState = null;
    resolveReason(side, targetType, uid, lpReduction);
    renderBoard(match);
    renderPickHint();
  }
  function skipMislead(){
    if (!misleadState) return;
    const { side, targetType, uid } = misleadState;
    misleadState = null;
    resolveReason(side, targetType, uid, 0);
    renderBoard(match);
    renderPickHint();
  }

  const MAX_FIELD = 5; // 公式ルール：現場は最大5枚まで

  // 手札の使用可否判定などで使う「レベル制限用のFILE枚数」。
  // アシスト中のパートナーもFILEエリアの枚数として数える(公式ルール)
  function getEffectiveFileCount(side){
    const s = match[side];
    return s.file.length + (s.partner && s.partner.assisting ? 1 : 0);
  }

  // 「手札の使用」が可能か判定する（レベル制限・1ターン1回制限）
  // ネクストヒントの②(任意の1枚使用)の最中は、通常の1ターン1回制限を受けない代わりに
  // 「①で加えたカードを除いたFILE枚数以下」のレベル制限だけがかかる
  function canPlayHandCard(side, uid){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const handCard = match[side].hand.find(c => c.uid === uid);
    const card = handCard ? CARD_BY_ID.get(handCard.cardId) : null;
    // 現場が5枚埋まっていても、既存の1枚をリムーブして出す「スイッチ」ができるため、
    // ここではブロックしない(スイッチの選択はensureFieldRoomで別途挟む)
    const level = card ? card.level : null;
    const fileCount = getEffectiveFileCount(side);
    const levelBlocked = level != null && level > fileCount;

    if (match.turn.nextHintPending) {
      if (levelBlocked) {
        return { ok: false, reason: `レベル${level}：FILEエリアが${level}枚以上必要です（現在${fileCount}枚）` };
      }
      return { ok: true, reason: '' };
    }
    if (match.turn.playedCardThisTurn) {
      return { ok: false, reason: 'このターンはすでに手札を使用しました' };
    }
    if (match.turn.nextHintUsedThisTurn) {
      return { ok: false, reason: 'このターンはネクストヒントを行ったため使用できません' };
    }
    if (levelBlocked) {
      return { ok: false, reason: `レベル${level}：FILEエリアが${level}枚以上必要です（現在${fileCount}枚）` };
    }
    return { ok: true, reason: '' };
  }

  // アシストが使えるか判定する
  function canUseAssist(side){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const partner = match[side].partner;
    if (!partner) return { ok: false, reason: 'パートナーがいません' };
    if (partner.sleeping) return { ok: false, reason: 'パートナーがスリープ状態です' };
    return { ok: true, reason: '' };
  }

  // アシスト：パートナーをスリープさせ、FILEエリアの一番上に移動させる
  // 今発動中/登場したカードを、画面左のパネルに大きく表示する(実況動画で
  // カードテキストが読めるようにするため)。次に表示が切り替わるまで残り続ける
  function showCardSpotlight(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c) return;
    const panel = document.getElementById('cardSpotlight');
    if (!panel) return;
    document.getElementById('cardSpotlightImg').src = cardImage(cardId);
    document.getElementById('cardSpotlightImg').alt = cardName(cardId);
    document.getElementById('cardSpotlightName').textContent = cardName(cardId);
    document.getElementById('cardSpotlightText').textContent = c.ability_text || '';
    panel.style.display = 'flex';
    // 連続で表示が切り替わるとき、毎回フェードインし直して見えるようにする
    panel.style.animation = 'none';
    void panel.offsetWidth;
    panel.style.animation = '';
  }
  function hideCardSpotlight(){
    const panel = document.getElementById('cardSpotlight');
    if (panel) panel.style.display = 'none';
  }

  // カットイン・変装専用の特別演出：斜めのスピード線＋カード絵が右からスライドイン
  function playCutInEffect(cardId, onDone){
    const overlay = document.getElementById('cutInEffect');
    if (!overlay) { if (onDone) onDone(); return; }
    document.getElementById('cutInEffectImg').src = cardImage(cardId);
    document.getElementById('cutInEffectImg').alt = cardName(cardId);
    overlay.style.display = 'flex';
    const stripes = overlay.querySelector('.cutin-stripes');
    const cardEl = overlay.querySelector('.cutin-card');
    // 連続で発動しても毎回アニメーションが最初から再生されるようにリセットする
    stripes.style.animation = 'none';
    cardEl.style.animation = 'none';
    void overlay.offsetWidth;
    stripes.style.animation = '';
    cardEl.style.animation = '';
    setTimeout(() => {
      overlay.style.display = 'none';
      if (onDone) onDone();
    }, 900);
  }
  // 事件カードの能力が発動したときに、キャラの登場時と同じ黄色い光るエフェクトを出す
  function flashCaseCard(side){
    const el = document.querySelector(`.zone[data-side="${side}"] .case-slot`);
    if (!el) return;
    el.classList.add('landing-flash');
    setTimeout(() => el.classList.remove('landing-flash'), 1000);
    showCardSpotlight(match[side].case.cardId);
  }
  function performAssist(side){
    if (!canUseAssist(side).ok) return;
    const partnerEl = document.querySelector(`.zone[data-side="${side}"] .partner-slot`);
    const partnerImg = cardImage(match[side].partner.cardId);
    const wasResolved = !!(match[side].case && match[side].case.resolved);
    recordEvent({ type: 'assist', side });
    const toEl = document.querySelector(`.zone[data-side="${side}"] .file-stack .assist-file-card`);
    // パートナーは裏面ではなく実際の顔を見せて移動させる
    if (partnerEl && toEl) flyGhostCard(partnerEl, toEl, partnerImg);

    const nowResolved = !!(match[side].case && match[side].case.resolved);
    if (!wasResolved && nowResolved) {
      const effect = getCaseResolvedEffect(match[side].case.cardId);
      if (effect && effect.type === 'oppDraw') {
        flashCaseCard(side);
        const oppSide = side === 'self' ? 'opponent' : 'self';
        const deckEl = document.querySelector(`.zone[data-side="${oppSide}"] .cardback-face`);
        recordEvent({ type: 'draw', side: oppSide });
        const handRow = document.querySelector(`.zone[data-side="${oppSide}"] .hand-row`);
        const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
        fadeDrawCard(deckEl, lastCard);
      } else if (effect && effect.type === 'selfHandDiscard') {
        flashCaseCard(side);
        startHandDiscard(side, match[side].case.uid, 1);
      }
    }
  }

  // 事件カードの「この事件が解決編になったとき、～」効果(段階的に対応パターンを増やす想定)
  function getCaseResolvedEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    if (c.ability_text.includes('この事件が解決編になったとき、相手はカードを1枚引く。')) {
      return { type: 'oppDraw' };
    }
    if (c.ability_text.includes('この事件が解決編になったとき、自分は手札を1枚リムーブする。')) {
      return { type: 'selfHandDiscard' };
    }
    return null;
  }

  // 事件解決：自分の事件レベル(先攻/後攻で異なる)以上の証拠があれば勝利する
  function getCaseLevel(side){
    const s = match[side];
    if (!s.case) return null;
    const cardDef = CARD_BY_ID.get(s.case.cardId);
    if (!cardDef) return null;
    return side === match.firstPlayer ? cardDef.difficulty_first : cardDef.difficulty_second;
  }
  function canSolveCase(side){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const s = match[side];
    if (!s.partner) return { ok: false, reason: 'パートナーがいません' };
    if (s.partner.sleeping) return { ok: false, reason: 'パートナーがスリープ状態です' };
    if (!s.case || !s.case.resolved) return { ok: false, reason: '事件が解決編ではありません' };
    const level = getCaseLevel(side);
    if (level == null || s.evidence.length < level) {
      return { ok: false, reason: `証拠が足りません（必要：${level}以上、現在：${s.evidence.length}）` };
    }
    return { ok: true, reason: '' };
  }
  // 事件カードによっては「自分の事件解決能力を書き換える」ものがある(ブラックインパクト！等)。
  // 現状対応しているのは、パートナーが指定の色の場合に「証拠を事件レベルの数だけ
  // リムーブすることで相手を敗北させる」に変わるパターンのみ
  function getCaseSolveOverrideEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/自分の【([^】]+?)】のパートナーの【事件解決】能力を以下の能力に書き換える。\n?【解決編】【証拠隠滅】【スリープ】〚証拠を事件レベルの数だけリムーブする〛：相手はゲームに敗北する。/);
    return m ? { partnerColor: m[1] } : null;
  }
  function performSolveCase(side){
    if (!canSolveCase(side).ok) return;
    const s = match[side];
    const overrideEffect = getCaseSolveOverrideEffect(s.case.cardId);
    const partnerCard = CARD_BY_ID.get(s.partner.cardId);
    if (overrideEffect && cardHasColor(partnerCard, overrideEffect.partnerColor)) {
      const level = getCaseLevel(side);
      recordEvent({ type: 'solveCaseEvidenceMill', side, count: level });
    } else {
      recordEvent({ type: 'solveCase', side });
    }
    showGameOverOverlay(side);
  }
  function showGameOverOverlay(winnerSide){
    const overlay = document.getElementById('gameOverOverlay');
    const label = (match[winnerSide] && match[winnerSide].deckName) || (winnerSide === 'self' ? '自分' : '相手');
    document.getElementById('gameOverTitle').textContent = `${label}の勝利！`;
    document.getElementById('gameOverMessage').textContent =
      `${label}が事件を解決しました。このまま対戦の様子を見続けることもできます。`;
    overlay.style.display = 'flex';
  }

  // アクション/推理どちらかを、名乗り状態(justEntered)でも行えるキーワードを持っているか
  // (常時持っている場合、一時的に付与されている場合の両方を見る)
  function hasQuickOrCharge(instance){
    return charHasKeyword(instance, '迅速') || charHasKeyword(instance, '突撃')
      || charHasKeyword(instance, '突撃［キャラ］') || charHasKeyword(instance, '突撃［事件］');
  }

  // ---- アクション［キャラ］：相手のスリープ状態のキャラを対象に宣言→相手はガードを選べる→
  // コンタクト(AP比較)でどちらかがリムーブされる(カットイン・変装で割り込み可能) ----
  function canUseAction(side, uid){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const actor = match[side].field.find(c => c.uid === uid);
    if (!actor) return { ok: false, reason: '' };
    if (actor.sleeping) return { ok: false, reason: 'スリープ状態では行えません' };
    if (actor.justEntered && !hasQuickOrCharge(actor)) {
      return { ok: false, reason: '名乗り状態では行えません' };
    }
    const oppSide = side === 'self' ? 'opponent' : 'self';
    const oppState = match[oppSide];
    const hasCharTarget = oppState.field.some(c => c.sleeping);
    // アクション［事件］：証拠が1つもない事件は対象にできない
    const hasCaseTarget = !!(oppState.case && oppState.evidence.length > 0);
    if (!hasCharTarget && !hasCaseTarget) {
      return { ok: false, reason: '対象になるスリープ状態のキャラ、または証拠のある相手の事件がありません' };
    }
    return { ok: true, reason: '' };
  }

  // ダイアログではなく、現場のカードを直接クリックして対象／ガードを選ぶ方式
  // 対象選択は現場のカードを直接クリックする方式、ガードは(相手に選んでもらうため)
  // 従来通りダイアログ形式にする
  let actionState = null; // { side, actorUid, oppSide, step:'target'|'guard', targetUid, targetType:'char'|'case', pendingUid }

  function startAction(side, uid){
    if (!canUseAction(side, uid).ok) return;
    const oppSide = side === 'self' ? 'opponent' : 'self';
    actionState = { side, actorUid: uid, oppSide, step: 'target', targetUid: null, targetType: null, pendingUid: null };
    renderBoard(match); // 相手の現場にハイライトを付けるため再描画
    renderPickHint();
    renderTurnBar(); // アクション中はターン終了を無効化する
  }

  // アクション対象を、相手の現場のカード(アクション［キャラ］)または相手の事件(アクション［事件］)を
  // クリックして選ぶ。事件は証拠が1つもない場合は対象にできない
  function selectActionTarget(uid){
    if (!actionState || actionState.step !== 'target') return;
    const oppState = match[actionState.oppSide];
    const charTarget = oppState.field.find(c => c.uid === uid && c.sleeping);
    const isCaseTarget = !!(oppState.case && oppState.case.uid === uid && oppState.evidence.length > 0);
    if (!charTarget && !isCaseTarget) return;
    actionState.targetUid = uid;
    actionState.targetType = isCaseTarget ? 'case' : 'char';
    recordEvent({
      type: 'actionDeclare', side: actionState.side,
      actorUid: actionState.actorUid, targetSide: actionState.oppSide, targetUid: uid, targetType: actionState.targetType,
    });
    const fromEl = document.querySelector(`.zone[data-side="${actionState.side}"] .field-row .char-card[data-uid="${actionState.actorUid}"]`);
    const toEl = isCaseTarget
      ? document.querySelector(`.zone[data-side="${actionState.oppSide}"] .case-slot`)
      : document.querySelector(`.zone[data-side="${actionState.oppSide}"] .field-row .char-card[data-uid="${uid}"]`);
    drawActionArrow(fromEl, toEl);
    // 〚ブレット〛：このキャラのアクションはガードできない(常時／一時付与どちらも)
    const actorInstance = match[actionState.side].field.find(c => c.uid === actionState.actorUid);
    const hasBullet = actorInstance && charHasKeyword(actorInstance, 'ブレット');
    const hasGuardCandidate = !hasBullet && match[actionState.oppSide].field.some(c => !c.sleeping);
    if (!hasGuardCandidate) { finalizeAction(null); return; }
    actionState.step = 'guard';
    renderBoard(match);
    renderPickHint();
    renderActionGuardOverlay();
    renderTurnBar(); // 対象選択中の暗さ解除を元に戻す
  }

  function finalizeAction(guardUid){
    const { side, actorUid, oppSide, targetUid, targetType } = actionState;
    actionState = null;

    // アクション［事件］がガードされなかった場合、証拠がリムーブされる瞬間の位置を
    // 再描画で消える前に記録しておく(手札リムーブ等と同じ理由)
    let evidenceSnapshot = null;
    let removedEvidenceCard = null;
    if (!guardUid && targetType === 'case') {
      const oppState = match[oppSide];
      removedEvidenceCard = oppState.evidence[oppState.evidence.length - 1] || null;
      if (removedEvidenceCard) {
        const stack = document.querySelector(`.zone[data-side="${oppSide}"] .evidence-stack`);
        const topBack = stack ? stack.querySelector('.evi-card-back:last-child') : null;
        const measureEl = topBack ? (topBack.querySelector('.back-img') || topBack) : null;
        if (measureEl) evidenceSnapshot = snapshotCardPosition(measureEl);
      }
    }

    if (!guardUid && targetType === 'case') {
      recordEvent({ type: 'actionResolve', side, actorUid, targetSide: oppSide, targetUid, targetType, guardUid: null });
      renderPickHint();
      renderActionGuardOverlay();
      renderTurnBar();
      setTimeout(clearActionArrow, 700);
      // 相手の一番上の証拠 → 相手のリムーブエリアへ(ここで初めて表向きになる)
      if (removedEvidenceCard && evidenceSnapshot) {
        const oppRemoveTop = document.querySelector(`.zone[data-side="${oppSide}"] .remove-top`);
        if (oppRemoveTop) flyGhostCard(evidenceSnapshot, oppRemoveTop, cardImage(removedEvidenceCard.cardId));
      }
      // 自分のデッキ → 自分の証拠エリアへ1枚(裏向きのまま)。証拠のリムーブが終わってから
      // 続けて再生されるよう、リムーブのアニメーション(flyGhostCardは.3s)の分だけ間をあける
      setTimeout(() => {
        const selfDeckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
        const selfStack = document.querySelector(`.zone[data-side="${side}"] .evidence-stack`);
        const selfLastBack = selfStack ? selfStack.querySelector('.evi-card-back:last-child') : null;
        if (selfLastBack) flyGhostCard(selfDeckEl, selfLastBack);
      }, removedEvidenceCard && evidenceSnapshot ? 350 : 0);
      // メアリー(Lv6)等：自分の現場にいるキャラのアクション［事件］で証拠を得たとき、
      // 手札を1枚リムーブしてもよい(そうした場合、証拠をもう1つ得る)。1ターン1回、カードごと
      const bonusSourceUid = match[side].field.find(c =>
        getBonusEvidenceOnActionEffect(c.cardId) && !match.turn.declaredAbilityUids.includes(c.uid)
      )?.uid;
      if (bonusSourceUid) {
        setTimeout(() => offerBonusEvidence(side, bonusSourceUid), 750);
      }
      // アクション終了時能力(バーボンLv8等)
      triggerActionEndAbility(side, actorUid);
      return;
    }
    // それ以外(キャラ対象、またはガードされた場合)は必ずコンタクトが発生する。
    // カットイン等の割り込みを挟んでからAP比較する
    renderActionGuardOverlay();
    renderTurnBar();
    setTimeout(clearActionArrow, 700);
    const defenderUid = guardUid || targetUid;
    startContact(side, actorUid, oppSide, defenderUid, targetType, guardUid);
  }

  // ---- コンタクト：行動順に沿ってカットインを挟める割り込みウィンドウ ----
  // 「1番目がパスし2番目が使用した場合のみ、1番目にもう一度だけ機会を与える」以外は
  // 各サイド1回まで(カットインまたは変装、変装は未実装)
  let contactState = null;
  // { attackerSide, attackerUid, defenderSide, defenderUid, targetType, guardUid,
  //   order:[firstSide, secondSide], queue:[...], passed:{}, usedCutIn:{}, apBuffs:[], reofferGiven }
  function startContact(attackerSide, attackerUid, defenderSide, defenderUid, targetType, guardUid){
    const attacker = match[attackerSide].field.find(c => c.uid === attackerUid);
    const defender = match[defenderSide].field.find(c => c.uid === defenderUid);
    const attackerAp = attacker ? effectiveAp(match, attacker, attackerSide) : 0;
