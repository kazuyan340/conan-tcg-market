    const defenderAp = defender ? effectiveAp(match, defender, defenderSide) : 0;
    // APが同じ場合はアクションされた側(=常にdefenderSide)が1番目
    const order = attackerAp < defenderAp ? [attackerSide, defenderSide] : [defenderSide, attackerSide];
    contactState = {
      attackerSide, attackerUid, defenderSide, defenderUid, targetType, guardUid,
      order, queue: [...order], passed: {}, usedCutIn: {}, apBuffs: [], reofferGiven: false,
    };
    renderBoard(match);
    renderPickHint();
  }
  // 【カットイン】能力を持つカードは、行頭が「【カットイン】AP＋N」の形式
  // (例：「【カットイン】AP＋2000（コンタクト中に手札からリムーブして使う）」)
  function getCutInEffects(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return [];
    const amounts = [];
    for (const line of c.ability_text.split('\n')) {
      const m = line.trim().match(/^【カットイン】AP＋(\d+)/);
      if (m) amounts.push(Number(m[1]));
    }
    return amounts;
  }
  // このキャラのコンタクト中に自分が【カットイン】を使用したとき、そのコンタクト中、
  // このキャラをAP＋Nする(キール等)
  function getCutInSelfBonusEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/このキャラのコンタクト中に自分が【カットイン】を使用したとき、そのコンタクト中、このキャラをAP＋(\d+)する。/);
    return m ? { amount: Number(m[1]) } : null;
  }
  // 【カットイン】【解決編】カードをN枚引く。【色】のキャラに【カットイン】する場合、
  // AP＋Mする。(6バーボン等：解決編限定。使用すると常にドローし、コンタクト中の
  // 自分のキャラが指定色ならAPも上がる)
  function getConditionalCutInDrawEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/^【カットイン】【解決編】カードを(\d+)枚引く。【([^】]+?)】のキャラに【カットイン】する場合、AP＋(\d+)/);
    return m ? { drawCount: Number(m[1]), color: m[2], apAmount: Number(m[3]) } : null;
  }
  // 【カットイン】【自分ターン中】自分の現場にいる〚特徴［○○］〛のキャラ1枚につき、
  // AP＋Nする。(吉田歩美等：使用時のAPボーナスが指定特徴のキャラ数に比例する)
  function getScalingCutInEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/^【カットイン】【自分ターン中】自分の現場にいる〚特徴［([^］]+)］〛のキャラ1枚につき、AP＋(\d+)/);
    return m ? { trait: m[1], perAmount: Number(m[2]) } : null;
  }
  // 手札のこのカードが、いずれかの形で【カットイン】として使用できるか(選択可否の判定用)
  function hasCutInAbility(cardId){
    return getCutInEffects(cardId).length > 0 || !!getConditionalCutInDrawEffect(cardId) || !!getScalingCutInEffect(cardId);
  }
  function maybeReofferContactFirst(){
    const [first, second] = contactState.order;
    if (!contactState.reofferGiven && contactState.passed[first] && contactState.usedCutIn[second] && !contactState.usedCutIn[first]) {
      contactState.reofferGiven = true;
      contactState.queue.push(first);
    }
  }
  function contactPass(){
    if (!contactState) return;
    const contactSide = contactState.queue.shift();
    contactState.passed[contactSide] = true;
    maybeReofferContactFirst();
    if (contactState.queue.length === 0) resolveContact(); else { renderBoard(match); renderPickHint(); }
  }
  function contactUseCutIn(contactSide, uid){
    if (!contactState || contactState.queue[0] !== contactSide) return;
    const handCard = match[contactSide].hand.find(c => c.uid === uid);
    if (!handCard) return;
    const effects = getCutInEffects(handCard.cardId);
    const conditionalDraw = getConditionalCutInDrawEffect(handCard.cardId);
    const scalingEffect = getScalingCutInEffect(handCard.cardId);
    if (effects.length === 0 && !conditionalDraw && !scalingEffect) return;
    playCutInEffect(handCard.cardId);
    contactState.queue.shift();
    contactState.usedCutIn[contactSide] = true;
    const fightingUid = contactSide === contactState.attackerSide ? contactState.attackerUid : contactState.defenderUid;
    const fightingCard = match[contactSide].field.find(c => c.uid === fightingUid);
    if (effects.length > 0) {
      contactState.apBuffs.push({ side: contactSide, amount: effects[0] });
      // キール等：自分がこのキャラのコンタクト中にカットインを使ったとき、
      // このキャラ自身にもさらにAPボーナスが乗る
      const selfBonus = fightingCard ? getCutInSelfBonusEffect(fightingCard.cardId) : null;
      if (selfBonus) contactState.apBuffs.push({ side: contactSide, amount: selfBonus.amount });
    } else if (conditionalDraw) {
      // 6バーボン等：解決編でなければ「使用はできるが何も起こらない」
      const caseResolved = !!(match[contactSide].case && match[contactSide].case.resolved);
      if (caseResolved) {
        if (fightingCard && cardHasColor(CARD_BY_ID.get(fightingCard.cardId), conditionalDraw.color)) {
          contactState.apBuffs.push({ side: contactSide, amount: conditionalDraw.apAmount });
        }
        for (let i = 0; i < conditionalDraw.drawCount; i++) {
          if (match[contactSide].deckPile.length === 0) break;
          const deckEl = document.querySelector(`.zone[data-side="${contactSide}"] .cardback-face`);
          recordEvent({ type: 'draw', side: contactSide });
          const handRow = document.querySelector(`.zone[data-side="${contactSide}"] .hand-row`);
          const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
          fadeDrawCard(deckEl, lastCard);
        }
      }
    } else if (scalingEffect) {
      // 吉田歩美等：【自分ターン中】限定。自分の現場にいる指定特徴のキャラ数に比例する
      if (match.turn && match.turn.activeSide === contactSide) {
        const count = match[contactSide].field.filter(c => cardHasTrait(CARD_BY_ID.get(c.cardId), scalingEffect.trait)).length;
        const amount = count * scalingEffect.perAmount;
        if (amount > 0) contactState.apBuffs.push({ side: contactSide, amount });
      }
    }
    recordEvent({ type: 'cutInUse', side: contactSide, uid });
    maybeReofferContactFirst();
    if (contactState.queue.length === 0) resolveContact(); else { renderBoard(match); renderPickHint(); }
  }
  // 変装バッジ(【変装】【FILEN】等)は印刷アイコンのみでability_textには含まれないため、
  // 自動判定できない。判明したカードだけをここに手動登録する
  // (428=ベルモット(Lv5)：【変装】【FILE5】。ユーザー確認済み)
  const DISGUISE_CARDS = {
    428: { fileMin: 5 },
  };
  function getDisguiseCondition(cardId){ return DISGUISE_CARDS[cardId] || null; }
  function canUseDisguise(side, handUid){
    if (!contactState || contactState.queue[0] !== side) return false;
    const handCard = match[side].hand.find(c => c.uid === handUid);
    if (!handCard) return false;
    const cond = getDisguiseCondition(handCard.cardId);
    if (!cond) return false;
    if (cond.fileMin != null && getEffectiveFileCount(side) < cond.fileMin) return false;
    if (cond.caseColor && !(match[side].case && cardHasColor(CARD_BY_ID.get(match[side].case.cardId), cond.caseColor))) return false;
    return true;
  }
  // 【変装時】の反応テキストのうち、実際に確認できているパターンだけ対応する
  // (ベルモットLv5：相手は手札を1枚リムーブしてもよい。しなかった場合、このコンタクトでリムーブされない)
  function getDisguiseTimeEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const firstLine = c.ability_text.split('\n')[0].trim();
    if (firstLine === '【変装時】相手は手札を1枚リムーブしてもよい。そうしなかった場合、このキャラはこのコンタクトによってリムーブされない。') {
      return { type: 'oppDiscardOrImmune' };
    }
    return null;
  }
  // 変装への反応：相手が手札を1枚リムーブするかどうかの選択(しなければ免疫が付く)
  let disguiseReactState = null; // { oppSide, immuneUid, onComplete }
  function selectDisguiseReactDiscard(uid){
    if (!disguiseReactState) return;
    const { oppSide, onComplete } = disguiseReactState;
    recordEvent({ type: 'handDiscard', side: oppSide, uid });
    disguiseReactState = null;
    renderBoard(match);
    renderPickHint();
    if (onComplete) onComplete();
  }
  function skipDisguiseReact(){
    if (!disguiseReactState) return;
    const { immuneUid, onComplete } = disguiseReactState;
    if (contactState) {
      contactState.immuneUids = contactState.immuneUids || [];
      contactState.immuneUids.push(immuneUid);
    }
    disguiseReactState = null;
    renderBoard(match);
    renderPickHint();
    if (onComplete) onComplete();
  }
  // 変装：手札の〚変装〛持ちキャラを、コンタクト中の自分のキャラと入れ替える。
  // 入れ替え自体は「登場」ではないため登場時能力は発動しない。uidは変えずにcardIdだけ
  // 差し替えることで、スリープ状態や一時効果(uidで紐づく)がそのまま引き継がれるようにする。
  // 元のキャラは裏向きでデッキの下に移る
  function contactUseDisguise(side, handUid){
    if (!canUseDisguise(side, handUid)) return;
    const handCard = match[side].hand.find(c => c.uid === handUid);
    const fightingUid = side === contactState.attackerSide ? contactState.attackerUid : contactState.defenderUid;
    const fighting = match[side].field.find(c => c.uid === fightingUid);
    if (!fighting) return;
    contactState.queue.shift();
    contactState.usedCutIn[side] = true; // 「カットインか変装のどちらか1回まで」なので同じフラグを使う
    const oldCardId = fighting.cardId;
    const newCardId = handCard.cardId;
    playCutInEffect(newCardId);
    recordEvent({
      type: 'disguiseSwap', side, uid: fightingUid, oldCardId, newCardId, handUid,
      deckCardUid: 'disguise_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    });
    maybeReofferContactFirst();
    const proceed = () => {
      if (contactState && contactState.queue.length === 0) resolveContact();
      else { renderBoard(match); renderPickHint(); }
    };
    const afterReveal = () => {
      const reactEffect = getDisguiseTimeEffect(newCardId);
      if (reactEffect) {
        const oppSide = side === 'self' ? 'opponent' : 'self';
        disguiseReactState = { oppSide, immuneUid: fightingUid, onComplete: proceed };
        renderBoard(match);
        renderPickHint();
      } else {
        proceed();
      }
    };
    // 変装で入れ替わったキャラが現場で見える(登場時と同じ光るエフェクト)まで待ってから、
    // 変装時能力(手札を捨てるか選ばせる等)を発動させる
    const fieldEl = document.querySelector(`.zone[data-side="${side}"] .field-row .char-card[data-uid="${fightingUid}"]`);
    if (fieldEl) {
      fieldEl.classList.add('landing-flash');
      setTimeout(() => { fieldEl.classList.remove('landing-flash'); afterReveal(); }, 1000);
    } else {
      afterReveal();
    }
  }
  function resolveContact(){
    const { attackerSide, attackerUid, defenderSide, defenderUid, targetType, guardUid, apBuffs, immuneUids } = contactState;
    contactState = null;
    // リムーブされる可能性があるので、消える前に現場での見た目の位置を控えておく
    // (実際にリムーブされたかは結果が出てから判定する)
    const defenderEl = document.querySelector(`.zone[data-side="${defenderSide}"] .field-row .char-card[data-uid="${defenderUid}"]`);
    const defenderSnapshot = defenderEl ? snapshotCardPosition(defenderEl) : null;
    recordEvent({
      type: 'actionResolve', side: attackerSide, actorUid: attackerUid, targetSide: defenderSide,
      targetUid: defenderUid, targetType, guardUid: guardUid || null, cutInBuffs: apBuffs, immuneUids: immuneUids || [],
    });
    renderPickHint();
    // コンタクトで実際にキャラがリムーブされていれば、そのキャラの
    // 【現場リムーブ時】能力のうち選択を伴わないものだけを自動発動する
    const removedCard = match[defenderSide].remove[match[defenderSide].remove.length - 1];
    if (removedCard && removedCard.uid === defenderUid) {
      const toEl = document.querySelector(`.zone[data-side="${defenderSide}"] .remove-top`);
      if (defenderSnapshot && toEl) flyGhostCard(defenderSnapshot, toEl, cardImage(removedCard.cardId));
      triggerFieldRemoveAbility(defenderSide, removedCard, attackerSide);
      // ジン＆ウォッカ等：自分のターン中に相手の現場のキャラがリムーブされたとき、
      // というattackerSide視点の汎用トリガー
      triggerOnOpponentCharRemoved(attackerSide);
    }
    // アクション終了時能力(バーボンLv8等)。コンタクトの有無・結果によらず発動する
    triggerActionEndAbility(attackerSide, attackerUid);
  }

  // 【パートナー(色)】【自分ターン中】【ターン1】相手の現場にいるキャラがリムーブされた
  // とき、AP◯以下のキャラを1枚まで選び、リムーブする。(ジン＆ウォッカ等)
  function getOnOpponentRemovedAbility(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【パートナー([^】]+?)】【自分ターン中】【ターン1】相手の現場にいるキャラがリムーブされたとき、AP(\d+)以下のキャラを1枚まで選び、リムーブする。/);
    return m ? { partnerColor: m[1], apLimit: Number(m[2]) } : null;
  }
  function triggerOnOpponentCharRemoved(beneficiarySide){
    if (!match.turn || match.turn.activeSide !== beneficiarySide) return;
    const partnerCard = match[beneficiarySide].partner ? CARD_BY_ID.get(match[beneficiarySide].partner.cardId) : null;
    const source = match[beneficiarySide].field.find(c => {
      if (match.turn.declaredAbilityUids.includes(c.uid)) return false;
      const effect = getOnOpponentRemovedAbility(c.cardId);
      return effect && cardHasColor(partnerCard, effect.partnerColor);
    });
    if (!source) return;
    const effect = getOnOpponentRemovedAbility(source.cardId);
    match.turn.declaredAbilityUids.push(source.uid);
    setTimeout(() => startPartnerRemove(beneficiarySide, source.uid, effect.apLimit, { filterType: 'ap', costType: 'none' }), 700);
  }

  // 【FILEN】このキャラのアクション終了時、このキャラを現場からリムーブしてもよい。
  // そうした場合、手札からレベル◯以下の【色】のキャラを1枚まで登場させる。(バーボンLv8等)
  function getActionEndSelfRemoveThenPlayEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【FILE(\d+)】このキャラのアクション終了時、このキャラを現場からリムーブしてもよい。そうした場合、手札からレベル(\d+)以下の【([^】]+?)】のキャラを1枚まで登場させる。/);
    return m ? { fileMin: Number(m[1]), levelMax: Number(m[2]), color: m[3] } : null;
  }
  let actionEndSwapState = null; // { side, sourceUid, levelMax, color }
  function triggerActionEndAbility(side, actorUid){
    const actor = match[side].field.find(c => c.uid === actorUid);
    if (!actor) return;
    const effect = getActionEndSelfRemoveThenPlayEffect(actor.cardId);
    if (!effect) return;
    if (getEffectiveFileCount(side) < effect.fileMin) return;
    const hasEligibleHand = match[side].hand.some(c => {
      const cd = CARD_BY_ID.get(c.cardId);
      return cd && cardHasColor(cd, effect.color) && cd.level != null && cd.level <= effect.levelMax;
    });
    if (!hasEligibleHand) return;
    setTimeout(() => {
      actionEndSwapState = { side, sourceUid: actorUid, levelMax: effect.levelMax, color: effect.color };
      renderBoard(match);
      renderPickHint();
    }, 700);
  }
  function selectActionEndSwapHand(uid){
    if (!actionEndSwapState) return;
    const { side, sourceUid } = actionEndSwapState;
    actionEndSwapState = null;
    recordEvent({ type: 'selfRemoveCost', side, uid: sourceUid });
    playCardFree(side, uid);
    renderPickHint();
  }
  function skipActionEndSwap(){
    actionEndSwapState = null;
    renderBoard(match);
    renderPickHint();
  }

  // アクション対象や、自分の手札からカードを直接選んでもらう必要がある間、
  // 案内文(と必要ならスキップボタン)を表示する共通の案内バー
  // 手札から選ぶ系の状態がアクティブな間、対象の手札だけが目立つよう他を灰色にする。
  // どのsideの手札を選んでいる最中かを返す(手札を選ぶ状態でなければnull)
  function getHandFocusSide(){
    if (deckPeekState && deckPeekState.step === 'remove') return deckPeekState.side;
    if (partnerRemoveState && partnerRemoveState.step === 'hand') return partnerRemoveState.side;
    if (handDiscardState) return handDiscardState.side;
    if (bonusEvidenceState) return bonusEvidenceState.side;
    if (disguiseReactState) return disguiseReactState.oppSide;
    if (contactState) {
      const turnSide = contactState.queue[0];
      const hasCutIn = match[turnSide].hand.some(c => hasCutInAbility(c.cardId));
      const hasDisguise = match[turnSide].hand.some(c => canUseDisguise(turnSide, c.uid));
      return (hasCutIn || hasDisguise) ? turnSide : null;
    }
    if (oppHandPickState) return oppHandPickState.oppSide;
    if (freePlayChoiceState) return freePlayChoiceState.side;
    if (actionEndSwapState) return actionEndSwapState.side;
    // ネクストヒントは「出さない」選択肢も普通にあるため、盤面を灰色にはしない
    return null;
  }
  function updateHandFocus(){
    const side = getHandFocusSide();
    if (side) document.body.dataset.handFocus = side; else delete document.body.dataset.handFocus;
  }
  function renderPickHint(){
    updateHandFocus();
    const bar = document.getElementById('actionHintBar');
    if (evidencePickState) {
      const label = evidencePickState.mode === 'toFaceDown' ? '裏向き' : '表向き';
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>「${cardName(uidToCardId(evidencePickState.sourceUid))}」の効果：証拠を${evidencePickState.max}つまで選んで${label}にできます（選択中：${evidencePickState.selectedUids.length}／${evidencePickState.max}。証拠エリアのカードをクリックして選択）。</span>
        ${evidencePickState.min <= 0 ? '<button class="btn ghost" id="pickHintSkipBtn">選ばない</button>' : ''}
        ${evidencePickState.selectedUids.length >= evidencePickState.min ? '<button class="btn" id="pickHintConfirmBtn">確定</button>' : ''}
      `;
      const skipBtn = document.getElementById('pickHintSkipBtn');
      if (skipBtn) skipBtn.onclick = () => skipEvidencePick();
      const confirmBtn = document.getElementById('pickHintConfirmBtn');
      if (confirmBtn) confirmBtn.onclick = () => confirmEvidencePick();
      return;
    }
    if (switchState) {
      bar.style.display = 'flex';
      bar.innerHTML = `<span>現場が5枚埋まっています。スイッチ：リムーブして入れ替えるキャラを自分の現場でクリックして選んでください（状態は問いません）。</span>`;
      return;
    }
    if (actionState && actionState.step === 'target') {
      bar.style.display = 'flex';
      bar.innerHTML = `<span>「${cardName(uidToCardId(actionState.actorUid))}」でアクション：相手のスリープ状態のキャラ、または証拠のある相手の事件を現場でクリックして選んでください。</span>`;
      return;
    }
    if (disguiseReactState) {
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>変装への反応：手札を1枚リムーブしてもよい（しなかった場合、変装したキャラはこのコンタクトでリムーブされません。手札をクリックして選択）。</span>
        <button class="btn ghost" id="pickHintSkipBtn">リムーブしない</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => skipDisguiseReact();
      return;
    }
    if (contactState) {
      const turnSide = contactState.queue[0];
      const turnLabel = turnSide === 'self' ? '自分' : '相手';
      const hasCutInCandidate = match[turnSide].hand.some(c => hasCutInAbility(c.cardId));
      const hasDisguiseCandidate = match[turnSide].hand.some(c => canUseDisguise(turnSide, c.uid));
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>コンタクト：「${cardName(uidToCardId(contactState.attackerUid))}」vs「${cardName(uidToCardId(contactState.defenderUid))}」（現在は${turnLabel}の番）。${hasCutInCandidate ? 'カットインを持つ手札のカードをクリックで使用できます。' : ''}${hasDisguiseCandidate ? '変装できる手札のカードをクリックで変装できます。' : ''}</span>
        <button class="btn ghost" id="pickHintSkipBtn">パス</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => contactPass();
      return;
    }
    if (oppHandPickState) {
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>「${cardName(uidToCardId(oppHandPickState.sourceUid))}」の登場時効果：相手の手札からレベル${oppHandPickState.levelLimit}以下のカードを1枚まで選んでリムーブできます（クリックして選択）。</span>
        <button class="btn ghost" id="pickHintSkipBtn">選ばない</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => skipOppHandPick();
      return;
    }
    if (freePlayChoiceState) {
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>「${cardName(uidToCardId(freePlayChoiceState.sourceUid))}」の効果：手札からレベル${freePlayChoiceState.levelMax}以下のキャラを1枚まで登場させられます（クリックして選択）。</span>
        <button class="btn ghost" id="pickHintSkipBtn">登場させない</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => skipFreePlayChoice();
      return;
    }
    if (actionEndSwapState) {
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>「${cardName(uidToCardId(actionEndSwapState.sourceUid))}」のアクション終了時効果：このキャラをリムーブして、手札からレベル${actionEndSwapState.levelMax}以下の【${actionEndSwapState.color}】のキャラを1枚まで登場させられます（クリックして選択）。</span>
        <button class="btn ghost" id="pickHintSkipBtn">しない</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => skipActionEndSwap();
      return;
    }
    if (keywordGrantChoiceState) {
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>「${cardName(uidToCardId(keywordGrantChoiceState.sourceUid))}」の効果：キャラを1枚まで選び、ターン終了時まで〚${keywordGrantChoiceState.keyword}〛を与えられます（現場のカードをクリックして選択）。</span>
        <button class="btn ghost" id="pickHintSkipBtn">選ばない</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => skipKeywordGrantChoice();
      return;
    }
    if (apBuffState) {
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>「${cardName(uidToCardId(apBuffState.sourceUid))}」の登場時効果：キャラを1枚まで選び、ターン終了時までAP＋${apBuffState.amount}する（現場のカードをクリックして選択）。</span>
        <button class="btn ghost" id="pickHintSkipBtn">選ばない</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => skipApBuffChoice();
      return;
    }
    if (misleadState) {
      const totalReduction = misleadState.selectedUids.reduce((sum, u) => {
        const c = match[misleadState.oppSide].field.find(fc => fc.uid === u);
        return sum + (c ? (getMisleadValue(c.cardId) || 0) : 0);
      }, 0);
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>相手が推理しました。ミスリードを使いますか？（現場のミスリード持ちキャラをクリックで選択、何枚でも同時使用可。選択中：LP－${totalReduction}）</span>
        <button class="btn ghost" id="pickHintSkipBtn">使用しない</button>
        ${misleadState.selectedUids.length > 0 ? '<button class="btn" id="pickHintConfirmBtn">確定</button>' : ''}
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => skipMislead();
      const confirmBtn = document.getElementById('pickHintConfirmBtn');
      if (confirmBtn) confirmBtn.onclick = () => confirmMislead();
      return;
    }
    if (sleepCostState) {
      bar.style.display = 'flex';
      bar.innerHTML = `<span>「${cardName(uidToCardId(sleepCostState.sourceUid))}」の宣言：スリープさせる他のキャラを現場でクリックして選んでください（自分・相手どちらでも）。</span>`;
      return;
    }
    if (lpBuffChoiceState) {
      bar.style.display = 'flex';
      bar.innerHTML = `<span>「${cardName(uidToCardId(lpBuffChoiceState.sourceUid))}」の宣言：ターン終了時までLP＋${lpBuffChoiceState.amount}するキャラを現場でクリックして選んでください。</span>`;
      return;
    }
    if (deckPeekState && deckPeekState.step === 'remove') {
      bar.style.display = 'flex';
      bar.innerHTML = `<span>「${cardName(uidToCardId(deckPeekState.chosenUid))}」を手札に加えました。手札から1枚クリックしてリムーブしてください。</span>`;
      return;
    }
    if (partnerRemoveState && partnerRemoveState.step === 'hand') {
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>「${cardName(uidToCardId(partnerRemoveState.sourceUid))}」の登場時効果：手札を1枚リムーブしてもよい（クリックして選択）。</span>
        <button class="btn ghost" id="pickHintSkipBtn">リムーブしない</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => finalizePartnerRemove(null, null);
      return;
    }
    if (handDiscardState) {
      bar.style.display = 'flex';
      bar.innerHTML = `<span>「${cardName(uidToCardId(handDiscardState.sourceUid))}」の登場時効果：手札からあと${handDiscardState.remaining}枚リムーブしてください（クリックして選択）。</span>`;
      return;
    }
    if (bonusEvidenceState) {
      bar.style.display = 'flex';
      bar.innerHTML = `
        <span>「${cardName(uidToCardId(bonusEvidenceState.sourceUid))}」：手札を1枚リムーブしてもよい（そうした場合、証拠を1つ得る。クリックして選択）。</span>
        <button class="btn ghost" id="pickHintSkipBtn">リムーブしない</button>
      `;
      document.getElementById('pickHintSkipBtn').onclick = () => skipBonusEvidence();
      return;
    }
    bar.style.display = 'none';
  }

  // ガード選択はdeckPeekOverlayのUIを流用したダイアログ形式(同時には発動しないため競合しない)
  function renderActionGuardOverlay(){
    const overlay = document.getElementById('deckPeekOverlay');
    if (!actionState || actionState.step !== 'guard') {
      if (!deckPeekState && !partnerRemoveState && !removeEventState) overlay.style.display = 'none';
      return;
    }
    overlay.style.display = 'flex';
    document.getElementById('deckPeekTitle').textContent = 'アクション';
    document.getElementById('deckPeekSource').style.display = 'none';
    const grid = document.getElementById('deckPeekCards');
    const hint = document.getElementById('deckPeekHint');
    const skipBtn = document.getElementById('deckPeekSkipBtn');
    const yesNoWrap = document.getElementById('deckPeekYesNo');
    grid.innerHTML = '';
    const pending = actionState.pendingUid;
    hint.textContent = `相手：「${cardName(uidToCardId(actionState.targetUid))}」へのアクションをガードしますか？（アクティブ状態のキャラでガードできます）`;
    match[actionState.oppSide].field.forEach(c => {
      const eligible = !c.sleeping;
      const div = document.createElement('div');
      div.className = 'mulligan-card' + (c.uid === pending ? ' selected' : '') + (eligible ? '' : ' dim');
      div.innerHTML = `<img src="${cardImage(c.cardId)}" alt="${cardName(c.cardId)}">`;
      div.title = cardName(c.cardId) + (eligible ? '' : '（スリープ状態）');
      if (eligible) div.onclick = () => { actionState.pendingUid = c.uid === pending ? null : c.uid; renderActionGuardOverlay(); };
      grid.appendChild(div);
    });
    skipBtn.style.display = pending ? 'none' : '';
    skipBtn.textContent = 'ガードしない';
    skipBtn.onclick = () => finalizeAction(null);
    yesNoWrap.style.display = pending ? 'flex' : 'none';
    if (pending) {
      document.getElementById('deckPeekYesBtn').textContent = 'このキャラでガード';
      document.getElementById('deckPeekYesBtn').onclick = () => {
        const guardUid = pending;
        // ガードされた場合、矢印の先をガードしたキャラに向け直す
        const fromEl = document.querySelector(`.zone[data-side="${actionState.side}"] .field-row .char-card[data-uid="${actionState.actorUid}"]`);
        const toEl = document.querySelector(`.zone[data-side="${actionState.oppSide}"] .field-row .char-card[data-uid="${guardUid}"]`);
        drawActionArrow(fromEl, toEl);
        finalizeAction(guardUid);
      };
      document.getElementById('deckPeekNoBtn').textContent = '選び直す';
      document.getElementById('deckPeekNoBtn').onclick = () => { actionState.pendingUid = null; renderActionGuardOverlay(); };
    }
  }

  // ネクストヒントが使えるか判定する
  function canUseNextHint(side){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    if (match[side].file.length === 0) {
      return { ok: false, reason: 'FILEエリアにカードがありません' };
    }
    if (match.turn.nextHintBlocked) {
      return { ok: false, reason: 'このターンはネクストヒントを使用できません' };
    }
    return { ok: true, reason: '' };
  }

  // ネクストヒント①：FILEエリアの1番上を手札に加える。②(任意の1枚使用)は
  // このあとcanPlayHandCard/playCardがnextHintPendingを見て許可する
  // (ダイアログではなく、手札のカードを直接クリックして選ぶ方式)。
  // ②は「しないことも選べる」任意行動なので、②を選ばないまま他の行動(推理・
  // アクション・ターン終了・ネクストヒントの再使用など)に進んでも構わない
  function startNextHint(side){
    if (!canUseNextHint(side).ok) return;
    match.turn.nextHintUsedThisTurn = true;
    match.turn.nextHintPending = true;
    // FILEエリアの一番上(=最後に置かれた)カードが再描画で消える前に位置を控えておく
    const stack = document.querySelector(`.zone[data-side="${side}"] .file-stack`);
    const topBack = stack ? stack.querySelector('.file-card-back:last-child') : null;
    const measureEl = topBack ? (topBack.querySelector('.back-img') || topBack) : null;
    const fileSnapshot = measureEl ? snapshotCardPosition(measureEl) : null;
    recordEvent({ type: 'nextHintDraw', side });
    renderTurnBar();
    renderBoard(match); // 手札のハイライトを付けるため再描画
    renderPickHint();
    if (fileSnapshot) {
      const handRow = document.querySelector(`.zone[data-side="${side}"] .hand-row`);
      const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
      fadeDrawCard(fileSnapshot, lastCard);
    }
  }

  function playCard(side, uid){
    if (!canPlayHandCard(side, uid).ok) return;
    const cardDef = CARD_BY_ID.get(uidToCardId(uid));
    const isEvent = !!cardDef && cardDef.card_type === 'イベント';
    if (match.turn.nextHintPending) {
      match.turn.nextHintPending = false;
      renderPickHint();
    } else {
      match.turn.playedCardThisTurn = true;
    }
    renderTurnBar();
    if (isEvent) executePlay(side, uid);
    else ensureFieldRoom(side, () => executePlay(side, uid));
  }

  // 「手札の使用」のレベル制限・1ターン1回制限を受けずに、能力で手札から直接
  // 登場させる場合に使う(ベルモットLv6等)。現場に出す処理・登場時効果の発動は
  // playCardと共通
  function playCardFree(side, uid){
    if (!match[side].hand.some(c => c.uid === uid)) return;
    ensureFieldRoom(side, () => executePlay(side, uid));
  }

  // スイッチ：現場は5枚までだが、埋まっている場合は既にいるキャラ(状態は問わない)を
  // 1枚リムーブしてから新しいキャラを出せる。空きがあれば即座にonReadyへ進む
  let switchState = null; // { side, onReady }
  function ensureFieldRoom(side, onReady){
    if (match[side].field.length < MAX_FIELD) { onReady(); return; }
    switchState = { side, onReady };
    renderBoard(match);
    renderPickHint();
  }
  function selectSwitchTarget(uid){
    if (!switchState) return;
    const { side, onReady } = switchState;
    const target = match[side].field.find(c => c.uid === uid);
    if (!target) return;
    // リムーブされて消える前に、見た目の位置を控えておく(リムーブエリアへ飛ばす演出用)
    const fieldEl = document.querySelector(`.zone[data-side="${side}"] .field-row .char-card[data-uid="${uid}"]`);
    const snapshot = fieldEl ? snapshotCardPosition(fieldEl) : null;
    const cardId = target.cardId;
    recordEvent({ type: 'switchRemove', side, uid });
    switchState = null;
    const oppSide = side === 'self' ? 'opponent' : 'self';
    const removedCard = match[side].remove[match[side].remove.length - 1];
    if (removedCard && removedCard.uid === uid) triggerFieldRemoveAbility(side, removedCard, oppSide);
    renderPickHint();
    const toEl = document.querySelector(`.zone[data-side="${side}"] .remove-top`);
    if (snapshot && toEl) { flyGhostCard(snapshot, toEl, cardImage(cardId)); setTimeout(onReady, 320); }
    else onReady();
  }

  // 【登場時】効果の判定・発動をまとめた共通処理。手札から出した場合(executePlay)だけでなく、
  // 能力によって「デッキから直接、現場にスリープ状態で登場させる」場合(灰原哀Lv5等の
  // 【現場リムーブ時】効果)も、カード効果文が「登場させる」と明記している通りこの
  // 登場時能力が発動するべきなので、両方から呼べる形にしてある(変装での入れ替わりは
  // 「登場」ではないため対象外＝呼ばない)
  function runEntryAbility(side, uid, cardId){
    const deckPeekEffect = getDeckPeekEffect(cardId);
    if (deckPeekEffect) { startDeckPeek(side, uid, deckPeekEffect); return; }
    const revealOneEffect = getRevealOneColorEffect(cardId);
    if (revealOneEffect) {
      startDeckPeek(side, uid, { count: 1, color: revealOneEffect.color, forceRemove: false, mandatory: true });
      return;
    }
    const partnerEffect = getPartnerRemoveEffect(cardId);
    if (partnerEffect && match[side].partner) {
      const partnerCard = CARD_BY_ID.get(match[side].partner.cardId);
      if (cardHasColor(partnerCard, partnerEffect.partnerColor)) {
        startPartnerRemove(side, uid, partnerEffect.apLimit);
        return;
      }
    }
    const evidenceRemoveEffect = getEvidenceRemoveEffect(cardId);
    if (evidenceRemoveEffect) {
      startPartnerRemove(side, uid, evidenceRemoveEffect.levelLimit, { filterType: 'level', costType: 'giveEvidence' });
      return;
    }
    const caseAndPartnerRemove = getCaseAndPartnerColorRemoveEffect(cardId);
    if (caseAndPartnerRemove) {
      const caseCard = match[side].case ? CARD_BY_ID.get(match[side].case.cardId) : null;
      const partnerCard = match[side].partner ? CARD_BY_ID.get(match[side].partner.cardId) : null;
      if (cardHasColor(caseCard, caseAndPartnerRemove.caseColor) && cardHasColor(partnerCard, caseAndPartnerRemove.partnerColor)) {
        startPartnerRemove(side, uid, caseAndPartnerRemove.levelLimit, { filterType: 'level', costType: 'none' });
        return;
      }
    }
    const oppHandRevealEffect = getPartnerHandRevealRemoveEffect(cardId);
    if (oppHandRevealEffect && match[side].partner) {
      const partnerCard = CARD_BY_ID.get(match[side].partner.cardId);
      if (cardHasColor(partnerCard, oppHandRevealEffect.partnerColor)) {
        startOppHandPick(side, uid, oppHandRevealEffect.levelLimit);
        return;
      }
    }
    const apBuffEffect = getEntryApBuffChoice(cardId);
    if (apBuffEffect) { startApBuffChoice(side, uid, apBuffEffect.amount); return; }
    const apBuffPlusKeyword = getEntryApBuffPlusKeywordEffect(cardId);
    if (apBuffPlusKeyword) {
      startApBuffChoice(side, uid, apBuffPlusKeyword.amount, null, { excludeSelf: true, keyword: apBuffPlusKeyword.keyword });
      return;
    }
    const drawDiscard = getDrawDiscardEffect(cardId);
    if (drawDiscard) {
      for (let i = 0; i < drawDiscard.drawCount; i++) {
        if (match[side].deckPile.length === 0) break;
        const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
        recordEvent({ type: 'draw', side });
        const handRow = document.querySelector(`.zone[data-side="${side}"] .hand-row`);
        const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
        fadeDrawCard(deckEl, lastCard);
      }
      startHandDiscard(side, uid, drawDiscard.discardCount);
      return;
    }
    const wipeEffect = getBoardWipeEffect(cardId);
    if (wipeEffect) {
      const partnerCard = match[side].partner ? CARD_BY_ID.get(match[side].partner.cardId) : null;
      if (cardHasColor(partnerCard, wipeEffect.partnerColor) && match[side].case && match[side].case.resolved) {
        recordEvent({ type: 'boardWipe', side });
        match.turn.nextHintBlocked = true;
        renderTurnBar();
        for (let i = 0; i < 2; i++) {
          if (match[side].file.length === 0) break;
          const fileEl = document.querySelector(`.zone[data-side="${side}"] .file-stack .file-card-back:last-child`);
          const snap = fileEl ? snapshotCardPosition(fileEl) : null;
          recordEvent({ type: 'fileToHand', side });
          const handRow = document.querySelector(`.zone[data-side="${side}"] .hand-row`);
          const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
          if (snap) fadeDrawCard(snap, lastCard);
        }
        startFreePlayChoice(side, uid, wipeEffect.levelMax, wipeEffect.color, null);
        return;
      }
    }
    const evidenceFaceDownEffect = getEvidenceFaceDownEntryEffect(cardId);
    if (evidenceFaceDownEffect) {
      const faceUpCount = match[side].evidence.filter(ev => ev.faceUp).length;
      if (faceUpCount > 0) {
        startEvidencePick(side, uid, 'toFaceDown', Math.min(evidenceFaceDownEffect.max, faceUpCount), null, 0);
      }
      return;
    }
    const multiEffect = getMultiChoiceRemoveChargeMillEffect(cardId);
    if (multiEffect) {
      const partnerCard = match[side].partner ? CARD_BY_ID.get(match[side].partner.cardId) : null;
      if (cardHasColor(partnerCard, multiEffect.partnerColor)) {
        startPartnerRemove(side, uid, Infinity, {
          filterType: 'none', costType: 'none',
          onComplete: () => {
            startKeywordGrantChoice(side, uid, '突撃', () => {
              const totalChars = match.self.field.length + match.opponent.field.length;
              const millCount = totalChars * multiEffect.millPerChar;
              if (millCount > 0) recordEvent({ type: 'millSelf', side, count: millCount });
            });
          },
        });
        return;
      }
    }
  }
  function executePlay(side, uid){
    const handCard = match[side].hand.find(c => c.uid === uid);
    const cardDef = handCard ? CARD_BY_ID.get(handCard.cardId) : null;
    const isEvent = !!cardDef && cardDef.card_type === 'イベント';
    const handEl = document.querySelector(`.zone[data-side="${side}"] .hand-row .hcard[data-uid="${uid}"]`);
    const fromRect = handEl ? handEl.getBoundingClientRect() : null;
    recordEvent({ type: 'play', side, uid });
    // 登場時効果は「登場させる→着地→光る→効果処理」の順にしたいので、
    // アニメーションが終わってから発動させる(演出中に割り込まないようにする)
    const triggerEntryAbility = () => {
      if (!handCard) return;
      showCardSpotlight(handCard.cardId);
      runEntryAbility(side, uid, handCard.cardId);
    };
    if (isEvent) {
      // イベントは現場に出ず、効果を解決してリムーブエリアへ(着地演出は行わない)
      triggerEntryAbility();
      return;
    }
    if (fromRect) {
      const fieldEl = document.querySelector(`.zone[data-side="${side}"] .field-row .char-card[data-uid="${uid}"]`);
      if (fieldEl) { animateCardEntry(fieldEl, fromRect, triggerEntryAbility); return; }
    }
    triggerEntryAbility();
  }

  // 手札から現場に出したカードを、実際に手札の位置から現場までスライドさせ、
  // 着地時に光るエフェクトを出す(盤面は90度回転しているため、画面上のズレ量を
  // カード自身のローカル座標系に変換してから移動させる必要がある)。
  // onDoneは着地の光るエフェクトまで終わった後に呼ばれる(登場時効果の発動タイミング用)
  function animateCardEntry(fieldEl, fromRect, onDone){
    const toRect = fieldEl.getBoundingClientRect();
    const dxScreen = fromRect.left + fromRect.width / 2 - (toRect.left + toRect.width / 2);
    const dyScreen = fromRect.top + fromRect.height / 2 - (toRect.top + toRect.height / 2);
    // fieldEl自身の祖先すべて(.tableの90度回転に加え、相手側は.rotate180の180度も)を
    // 合成した行列を使う。.tableだけを使うと、相手側でこの180度分が抜け落ちて
    // 移動方向が逆になってしまう
    const m = getScreenTransformMatrix(fieldEl.parentElement);
    // 平行移動量(ベクトル)を変換したいので、回転・拡大縮小成分だけ使って逆変換する
    const vec = new DOMMatrix([m.a, m.b, m.c, m.d, 0, 0]).inverse();
    const local = vec.transformPoint(new DOMPoint(dxScreen, dyScreen));
    const scale = toRect.width > 0 ? fromRect.width / toRect.width : 1;
    fieldEl.style.transition = 'none';
    fieldEl.style.transform = `translate(${local.x}px, ${local.y}px) scale(${scale})`;
    fieldEl.style.opacity = '0.85';
    // 上の初期状態を確実に描画してから遷移させる(reflowを挟まないとアニメーションしない)
    fieldEl.getBoundingClientRect();
    requestAnimationFrame(() => {
      fieldEl.style.transition = 'transform .32s cubic-bezier(.2,.8,.3,1), opacity .32s';
      fieldEl.style.transform = 'translate(0, 0) scale(1)';
      fieldEl.style.opacity = '1';
    });
    let done = false;
    const onEnd = () => {
      if (done) return;
      done = true;
      fieldEl.removeEventListener('transitionend', onEnd);
      fieldEl.style.transition = '';
      fieldEl.style.transform = '';
      fieldEl.style.opacity = '';
      fieldEl.classList.add('landing-flash');
      setTimeout(() => {
        fieldEl.classList.remove('landing-flash');
        if (onDone) onDone();
      }, 1000);
    };
    fieldEl.addEventListener('transitionend', onEnd);
    // 移動元と移動先がたまたま同じ位置・拡大率だった場合、transformが変化せず
    // transitionendが一切発火しないことがある。その場合でも登場時効果が
    // 永久に発動しなくなることがないよう、保険のタイムアウトで必ず先へ進める
    setTimeout(onEnd, 500);
  }

  // ---- カード効果文からの自動判定(段階的に対応パターンを増やす想定) ----
  // 【登場時】自分のデッキのカードを上からN枚見る。その中から【色】のカード／キャラを
  // 1枚まで公開して手札に加え、残りを(好きな順番で)デッキの下に移す。
  // (「カードを手札に加えた場合、手札を1枚リムーブする。」が続く場合のみ、その後で
  // 手札を1枚リムーブするステップが必要。LP条件などの細かい絞り込みは未対応)
  function getDeckPeekEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const re = /デッキのカードを上から(\d+)枚見る。その中から(?:LP\d+(?:以上)?の)?【([^】]+?)】の(?:カード|キャラ|イベント)を1枚まで公開して手札に加え、残りを(?:好きな順番で)?デッキの下に移す。/;
    const m = c.ability_text.match(re);
    if (!m) return null;
    const tail = c.ability_text.slice(m.index + m[0].length, m.index + m[0].length + 30);
    return { count: Number(m[1]), color: m[2], forceRemove: tail.includes('手札を1枚リムーブする') };
  }

  // 【登場時】自分のデッキのカードを上から1枚公開する。公開したカードが【色】の
  // カード／キャラの場合、手札に加える。公開したカードがそれ以外の場合、デッキの下に移す。
  // (合致した場合は必ず加える「選べない」効果。カード名／特徴／レベル条件は未対応)
  function getRevealOneColorEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【登場時】自分のデッキのカードを上から1枚公開する。公開したカードが【([^】]+?)】の(?:カード|キャラ)の場合、手札に加える。公開したカードがそれ以外の場合、デッキの下に移す。/);
    return m ? { color: m[1] } : null;
  }

  // 【パートナー(色)】【登場時】手札を1枚リムーブしてもよい。そうした場合、
  // AP◯◯以下のキャラを1枚まで選び、リムーブする。(パートナーの色が条件に合う時だけ発動)
  function getPartnerRemoveEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【パートナー([^】]+?)】【登場時】手札を1枚リムーブしてもよい。そうした場合、AP(\d+)以下のキャラを1枚まで選び、リムーブする。/);
    return m ? { partnerColor: m[1], apLimit: Number(m[2]) } : null;
  }

  // 【パートナー(色)】【登場時】相手は手札を公開する。その中からレベル◯以下の
  // カードを1枚まで選び、相手はそれをリムーブする。(バーボンLv7等。このアプリでは
  // 相手の手札はもとから見えているので、対象条件を満たすカードを直接クリックで選ぶ)
  function getPartnerHandRevealRemoveEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【パートナー([^】]+?)】【登場時】相手は手札を公開する。その中からレベル(\d+)以下のカードを1枚まで選び、相手はそれをリムーブする。/);
    return m ? { partnerColor: m[1], levelLimit: Number(m[2]) } : null;
  }
  let oppHandPickState = null; // { side, sourceUid, oppSide, levelLimit }
  function startOppHandPick(side, sourceUid, levelLimit){
    const oppSide = side === 'self' ? 'opponent' : 'self';
    oppHandPickState = { side, sourceUid, oppSide, levelLimit };
    renderBoard(match);
    renderPickHint();
  }
  function selectOppHandPick(uid){
    if (!oppHandPickState) return;
    const { oppSide } = oppHandPickState;
    recordEvent({ type: 'handDiscard', side: oppSide, uid });
    oppHandPickState = null;
    renderBoard(match);
    renderPickHint();
  }
  function skipOppHandPick(){
    oppHandPickState = null;
    renderBoard(match);
    renderPickHint();
  }

  // 【登場時】相手に証拠を1つ与えてもよい。そうした場合、レベル◯◯以下のキャラを
  // 1枚まで選び、リムーブする。(赤井秀一Lv8等)
  function getEvidenceRemoveEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【登場時】相手に証拠を1つ与えてもよい。そうした場合、レベル(\d+)以下のキャラを1枚まで選び、リムーブする。/);
    return m ? { levelLimit: Number(m[1]) } : null;
  }

  // 【事件(色)】【パートナー(色)】【登場時】レベル◯以下のキャラを1枚まで選び、
  // リムーブする。(ラムLv8等。コスト無し、事件・パートナー両方の色条件を満たす時だけ発動)
  function getCaseAndPartnerColorRemoveEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【事件([^】]+?)】【パートナー([^】]+?)】【登場時】レベル(\d+)以下のキャラを1枚まで選び、リムーブする。/);
    return m ? { caseColor: m[1], partnerColor: m[2], levelLimit: Number(m[3]) } : null;
  }

  // 【登場時】キャラを1枚まで選び、ターン終了時までAP＋Nする(自分・相手どちらの
  // 現場のキャラも選べ、選ばなくてもよい)
  function getEntryApBuffChoice(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【登場時】(?:【[^】]*】)*キャラを1枚まで選び、ターン終了時までAP＋(\d+)する。/);
    return m ? { amount: Number(m[1]) } : null;
  }

  // 【登場時】このキャラ以外のキャラを1枚まで選び、ターン終了時までAP＋Nし、
  // 〚キーワード〛を与える。(ベルモットLv5等)
  function getEntryApBuffPlusKeywordEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【登場時】このキャラ以外のキャラを1枚まで選び、ターン終了時までAP＋(\d+)し、〚([^〛]+)〛を与える。/);
    return m ? { amount: Number(m[1]), keyword: m[2] } : null;
  }

  // 【宣言】[【スリープ】]：[【色】の]キャラを1枚まで選び、ターン終了時までAP＋Nする。
  // (「このキャラ以外の」「◯色以外の」等の除外条件、〚〛の追加コストや別能力付与を
  // 伴う複雑なものは未対応。コストは【スリープ】(このキャラをスリープさせる)のみ対応、
  // 【ターン1】は1ターンにこのキャラで1回までの制限として扱う)
  function getDeclareApBuffEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    for (const line of c.ability_text.split('\n')) {
      if (!line.startsWith('【宣言】')) continue;
      if (line.includes('〛')) continue;
      if (line.includes('このキャラ以外')) continue;
      if (line.includes('以外の色を持つ')) continue;
      const m = line.match(/(?:【([^】]+?)】の)?キャラを1枚まで選び、ターン終了時までAP＋(\d+)する。/);
      if (!m) continue;
      return {
        costSleep: line.includes('【スリープ】'),
        onceLimit: line.includes('【ターン1】'),
        color: m[1] || null,
        amount: Number(m[2]),
      };
    }
    return null;
  }

  function canDeclareApBuff(side, uid){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const actor = match[side].field.find(c => c.uid === uid);
    if (!actor) return { ok: false, reason: '' };
    const effect = getDeclareApBuffEffect(actor.cardId);
    if (!effect) return { ok: false, reason: '' };
    if (effect.costSleep && actor.sleeping) return { ok: false, reason: 'スリープ状態では行えません' };
    if (effect.onceLimit && match.turn.declaredAbilityUids.includes(uid)) {
      return { ok: false, reason: 'このターンはすでに使用しました' };
    }
    return { ok: true, reason: '' };
  }

  function declareApBuff(side, uid){
    const check = canDeclareApBuff(side, uid);
    if (!check.ok) return;
    const actor = match[side].field.find(c => c.uid === uid);
    const effect = getDeclareApBuffEffect(actor.cardId);
    showCardSpotlight(actor.cardId);
    if (effect.onceLimit) match.turn.declaredAbilityUids.push(uid);
    if (effect.costSleep) recordEvent({ type: 'declareSleepCost', side, uid });
    startApBuffChoice(side, uid, effect.amount, effect.color);
  }

  // 【宣言】【ターン1】〚このキャラ以外のキャラを1枚スリープさせる〛：カードを1枚引き、
  // 手札を1枚リムーブする。ターン終了時までこのキャラをLP＋Nする。(江戸川コナンLv4等)
  function getSleepOtherDeclareEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【宣言】【ターン1】〚このキャラ以外のキャラを1枚スリープさせる〛：カードを1枚引き、手札を1枚リムーブする。ターン終了時までこのキャラをLP＋(\d+)する。/);
    return m ? { lpAmount: Number(m[1]) } : null;
  }
  function canDeclareSleepOther(side, uid){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const actor = match[side].field.find(c => c.uid === uid);
    if (!actor) return { ok: false, reason: '' };
    const effect = getSleepOtherDeclareEffect(actor.cardId);
    if (!effect) return { ok: false, reason: '' };
    if (match.turn.declaredAbilityUids.includes(uid)) return { ok: false, reason: 'このターンはすでに使用しました' };
    const hasOtherActive = ['self', 'opponent'].some(s => match[s].field.some(c => c.uid !== uid && !c.sleeping));
    if (!hasOtherActive) return { ok: false, reason: 'スリープさせる他のキャラがいません' };
    return { ok: true, reason: '' };
  }
  // コスト(他のキャラをスリープさせる)を現場のカードを直接クリックして選ぶ
  let sleepCostState = null; // { side, sourceUid }
  function declareSleepOther(side, uid){
    if (!canDeclareSleepOther(side, uid).ok) return;
    showCardSpotlight(uidToCardId(uid));
    sleepCostState = { side, sourceUid: uid };
    renderBoard(match);
    renderPickHint();
  }
  function selectSleepCostTarget(targetSide, targetUid){
    if (!sleepCostState) return;
    const { side, sourceUid } = sleepCostState;
    match.turn.declaredAbilityUids.push(sourceUid);
    recordEvent({ type: 'declareSleepTarget', side: targetSide, uid: targetUid });
    sleepCostState = null;
    renderPickHint();
    // 効果解決：カードを1枚引く
    if (match[side].deckPile.length > 0) {
      const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
      recordEvent({ type: 'draw', side });
      const handRow = document.querySelector(`.zone[data-side="${side}"] .hand-row`);
      const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
      fadeDrawCard(deckEl, lastCard);
    }
    const effect = getSleepOtherDeclareEffect(uidToCardId(sourceUid));
    recordEvent({ type: 'lpBuffApply', side, targetUid: sourceUid, amount: effect.lpAmount });
    startHandDiscard(side, sourceUid, 1);
  }

  // 事件カード自身の【解決編】【宣言】【ターン1】〚裏向きの証拠をN枚表向きにする〛：
  // 相手は手札を1枚リムーブする。この効果によって相手がレベルM以下のカードをリムーブした
  // 場合、自分はカードを1枚引く。(ブラックインパクト！等)
  function getCaseFaceUpRevealDeclareEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【解決編】【宣言】【ターン1】〚裏向きの証拠を(\d+)つ表向きにする〛：相手は手札を1枚リムーブする。この効果によって相手がレベル(\d+)以下のカードをリムーブした場合、自分はカードを1枚引く。/);
    return m ? { faceUpCount: Number(m[1]), levelLimit: Number(m[2]) } : null;
  }
  function canDeclareCaseFaceUpReveal(side){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const s = match[side];
    if (!s.case) return { ok: false, reason: '' };
    const effect = getCaseFaceUpRevealDeclareEffect(s.case.cardId);
    if (!effect) return { ok: false, reason: '' };
    if (!s.case.resolved) return { ok: false, reason: '解決編でのみ使用できます' };
    if (match.turn.declaredAbilityUids.includes(s.case.uid)) return { ok: false, reason: 'このターンはすでに使用しました' };
    const faceDownCount = s.evidence.filter(ev => !ev.faceUp).length;
    if (faceDownCount < effect.faceUpCount) return { ok: false, reason: `裏向きの証拠が足りません（必要：${effect.faceUpCount}）` };
    return { ok: true, reason: '' };
  }
  function declareCaseFaceUpReveal(side){
    const check = canDeclareCaseFaceUpReveal(side);
    if (!check.ok) return;
    const s = match[side];
    const effect = getCaseFaceUpRevealDeclareEffect(s.case.cardId);
    const caseUid = s.case.uid;
    match.turn.declaredAbilityUids.push(caseUid);
    flashCaseCard(side);
    startEvidencePick(side, caseUid, 'toFaceUp', effect.faceUpCount, () => {
      const oppSide = side === 'self' ? 'opponent' : 'self';
      if (match[oppSide].hand.length === 0) return;
      // どのカードをリムーブするかは相手自身が選ぶ(発動したプレイヤーが選ぶのではない)
      startHandDiscard(oppSide, caseUid, 1, (discardedCardId) => {
        const discardedDef = CARD_BY_ID.get(discardedCardId);
        if (discardedDef && discardedDef.level != null && discardedDef.level <= effect.levelLimit) {
          const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
          recordEvent({ type: 'draw', side });
          const handRow = document.querySelector(`.zone[data-side="${side}"] .hand-row`);
          const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
          fadeDrawCard(deckEl, lastCard);
        }
      });
    }, effect.faceUpCount);
  }

  // 【宣言】〚リムーブエリアに移す〛：自分のリムーブエリアにある【色】のイベントを
  // 1枚まで選び、手札に加える。(灰原哀Lv3等。コストはこのキャラ自身をリムーブすること)
  function getRemoveEventEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【宣言】〚リムーブエリアに移す〛：自分のリムーブエリアにある【([^】]+?)】のイベントを1枚まで選び、手札に加える。/);
    return m ? { color: m[1] } : null;
  }
  function canDeclareRemoveEvent(side, uid){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const actor = match[side].field.find(c => c.uid === uid);
    if (!actor) return { ok: false, reason: '' };
    if (!getRemoveEventEffect(actor.cardId)) return { ok: false, reason: '' };
    return { ok: true, reason: '' };
  }
  let removeEventState = null; // { side, sourceUid, color, pendingUid }
  function declareRemoveEvent(side, uid){
    if (!canDeclareRemoveEvent(side, uid).ok) return;
    const actor = match[side].field.find(c => c.uid === uid);
    const effect = getRemoveEventEffect(actor.cardId);
    showCardSpotlight(actor.cardId);
    // コスト：このキャラ自身をリムーブエリアに移す
    recordEvent({ type: 'selfRemoveCost', side, uid });
    removeEventState = { side, sourceUid: uid, color: effect.color, pendingUid: null };
    renderRemoveEventOverlay();
  }
  function finalizeRemoveEvent(chosenUid){
    const { side } = removeEventState;
    recordEvent({ type: 'removeEventToHand', side, uid: chosenUid });
    removeEventState = null;
    renderRemoveEventOverlay();
  }

  // 【宣言】【スリープ】〚デッキの下に移す〛：自分の現場にいるLP◯以下の
  // 〚カード名［○○］〛を1枚まで選び、ターン終了時までLP＋Nする。(東尾マリア等。
  // コストは、アクティブ状態でこのカード自身をデッキの下に移すこと)
  function getSelfToDeckBottomDeclareEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【宣言】【スリープ】〚デッキの下に移す〛：自分の現場にいるLP(\d+)以下の〚カード名［([^］]+)］〛を1枚まで選び、ターン終了時までLP＋(\d+)する。/);
    if (!m) return null;
    return { lpMax: Number(m[1]), cardName: m[2], lpAmount: Number(m[3]) };
  }
  function canDeclareSelfToDeckBottom(side, uid){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const actor = match[side].field.find(c => c.uid === uid);
    if (!actor) return { ok: false, reason: '' };
    if (actor.sleeping) return { ok: false, reason: 'スリープ状態では行えません' };
    const effect = getSelfToDeckBottomDeclareEffect(actor.cardId);
    if (!effect) return { ok: false, reason: '' };
    const hasTarget = match[side].field.some(c => {
      if (c.uid === uid) return false;
      const cd = CARD_BY_ID.get(c.cardId);
      return cd && cd.lp != null && cd.lp <= effect.lpMax && cd.name === effect.cardName;
    });
    if (!hasTarget) return { ok: false, reason: '対象になるキャラがいません' };
    return { ok: true, reason: '' };
  }
  // 〚デッキの下に移す〛コストの共通演出：登場時と同じ光るエフェクト→
  // スリープ状態への回転→デッキへ飛んでいくアニメーション、の順で見せてから
  // 実際のコスト処理(現場から取り除きデッキの下に積む)を進める
  function performSelfToDeckBottomCost(side, uid, onDone){
    const fieldEl = document.querySelector(`.zone[data-side="${side}"] .field-row .char-card[data-uid="${uid}"]`);
    const cardId = uidToCardId(uid);
    showCardSpotlight(cardId);
    const finish = () => {
      const snapshot = fieldEl ? snapshotCardPosition(fieldEl) : null;
      recordEvent({ type: 'selfToDeckBottomCost', side, uid });
      const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
      if (snapshot && deckEl) { flyGhostCard(snapshot, deckEl, cardImage(cardId)); setTimeout(onDone, 320); }
      else onDone();
    };
    if (fieldEl) {
      fieldEl.classList.add('landing-flash');
      setTimeout(() => {
        fieldEl.classList.remove('landing-flash');
        fieldEl.classList.add('sleeping'); // コストの一環として、見た目上スリープの縦横回転を見せる
        setTimeout(finish, 520);
      }, 1000);
    } else {
      finish();
    }
  }
  // 対象は自分の現場のキャラのみなので、現場のカードを直接クリックして選ぶ
  let lpBuffChoiceState = null; // { side, sourceUid, amount, nameFilter, lpMaxFilter }
  function declareSelfToDeckBottom(side, uid){
    if (!canDeclareSelfToDeckBottom(side, uid).ok) return;
    const actor = match[side].field.find(c => c.uid === uid);
    const effect = getSelfToDeckBottomDeclareEffect(actor.cardId);
    performSelfToDeckBottomCost(side, uid, () => {
      lpBuffChoiceState = { side, sourceUid: uid, amount: effect.lpAmount, nameFilter: effect.cardName, lpMaxFilter: effect.lpMax };
      renderBoard(match);
      renderPickHint();
    });
  }
  function selectLpBuffTarget(uid){
    if (!lpBuffChoiceState) return;
    const { side, amount } = lpBuffChoiceState;
    recordEvent({ type: 'lpBuffApply', side, targetUid: uid, amount });
    lpBuffChoiceState = null;
    renderBoard(match);
    renderPickHint();
  }

  // 手札から、通常の「手札の使用」制限(レベル・1ターン1回)を受けずにキャラを1枚まで
  // 登場させる(選ばなくてもよい)。登場させた場合、続けてターン終了時までキーワードを
  // 付与できる(chargeKeywordが指定されている場合のみ)。ベルモットLv6・カッ(イベント)等
  let freePlayChoiceState = null; // { side, sourceUid, levelMax, color, chargeKeyword }
  function startFreePlayChoice(side, sourceUid, levelMax, color, chargeKeyword){
    freePlayChoiceState = { side, sourceUid, levelMax, color, chargeKeyword: chargeKeyword || null };
    renderBoard(match);
    renderPickHint();
  }
  function selectFreePlayChoice(uid){
    if (!freePlayChoiceState) return;
    const { side, chargeKeyword } = freePlayChoiceState;
    freePlayChoiceState = null;
    playCardFree(side, uid);
    if (chargeKeyword) recordEvent({ type: 'tempKeywordGrant', side, targetUid: uid, keyword: chargeKeyword });
    renderPickHint();
  }
  function skipFreePlayChoice(){
    freePlayChoiceState = null;
    renderBoard(match);
    renderPickHint();
  }

  // 【宣言】【スリープ】〚デッキの下に移す〛：手札からレベル◯以下のキャラを1枚まで
  // 登場させる。ターン終了時までそのキャラに〚突撃〛を与える。(ベルモットLv6等。
  // コストは東尾マリアと同じ「アクティブ状態でこのカード自身をデッキ下に戻す」)
  function getFreePlayGrantChargeEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【宣言】【スリープ】〚デッキの下に移す〛：手札からレベル(\d+)以下のキャラを1枚まで登場させる。ターン終了時までそのキャラに〚突撃〛（登場したターンからすぐにアクションできる）を与える。/);
    return m ? { levelMax: Number(m[1]) } : null;
  }
  function canDeclareFreePlayGrantCharge(side, uid){
    if (replayMode || mulliganPhase) return { ok: false, reason: '' };
    if (!match.turn || match.turn.activeSide !== side || match.turn.phase !== 'main') {
      return { ok: false, reason: '自分のメインフェイズでのみ使用できます' };
    }
    const actor = match[side].field.find(c => c.uid === uid);
    if (!actor) return { ok: false, reason: '' };
    if (actor.sleeping) return { ok: false, reason: 'スリープ状態では行えません' };
    const effect = getFreePlayGrantChargeEffect(actor.cardId);
    if (!effect) return { ok: false, reason: '' };
    // コストでこのキャラ自身がデッキの下に移り、現場に1枠空く。そこに新しいキャラが
    // 入るだけなので、現場が5枚埋まっていても(このキャラを含めて5枚なら)問題なく使える
    return { ok: true, reason: '' };
  }
  function declareFreePlayGrantCharge(side, uid){
    if (!canDeclareFreePlayGrantCharge(side, uid).ok) return;
    const actor = match[side].field.find(c => c.uid === uid);
    const effect = getFreePlayGrantChargeEffect(actor.cardId);
    performSelfToDeckBottomCost(side, uid, () => startFreePlayChoice(side, uid, effect.levelMax, null, '突撃'));
  }
  function renderRemoveEventOverlay(){
    const overlay = document.getElementById('deckPeekOverlay');
    if (!removeEventState) {
      if (!deckPeekState && !partnerRemoveState && !(actionState && actionState.step === 'guard')) overlay.style.display = 'none';
      return;
    }
    overlay.style.display = 'flex';
    document.getElementById('deckPeekTitle').textContent = '宣言効果';
    const sourcePanel = document.getElementById('deckPeekSource');
    const sourceCardId = uidToCardId(removeEventState.sourceUid);
    sourcePanel.style.display = sourceCardId != null ? 'flex' : 'none';
    if (sourceCardId != null) sourcePanel.innerHTML = `<img src="${cardImage(sourceCardId)}" alt="${cardName(sourceCardId)}">`;
    const grid = document.getElementById('deckPeekCards');
    const hint = document.getElementById('deckPeekHint');
    const skipBtn = document.getElementById('deckPeekSkipBtn');
    const yesNoWrap = document.getElementById('deckPeekYesNo');
    const yesBtn = document.getElementById('deckPeekYesBtn');
    const noBtn = document.getElementById('deckPeekNoBtn');
    grid.innerHTML = '';
    yesBtn.textContent = 'はい';
    noBtn.textContent = 'いいえ';
    const pending = removeEventState.pendingUid;
    const candidates = match[removeEventState.side].remove.filter(inst => {
      const cd = CARD_BY_ID.get(inst.cardId);
      return cd && cd.card_type === 'イベント' && cardHasColor(cd, removeEventState.color);
    });
    hint.textContent = pending ? '手札に加えますか？' : `【${removeEventState.color}】のイベントを1枚まで選んで手札に加えられます。`;
    skipBtn.style.display = pending ? 'none' : '';
    skipBtn.textContent = '加えない';
    skipBtn.onclick = () => finalizeRemoveEvent(null);
    yesNoWrap.style.display = pending ? 'flex' : 'none';
    if (pending) {
      yesBtn.onclick = () => finalizeRemoveEvent(pending);
      noBtn.onclick = () => { removeEventState.pendingUid = null; renderRemoveEventOverlay(); };
    }
    candidates.forEach(inst => {
      const div = document.createElement('div');
      div.className = 'mulligan-card' + (inst.uid === pending ? ' selected' : '');
      div.innerHTML = `<img src="${cardImage(inst.cardId)}" alt="${cardName(inst.cardId)}">`;
      div.onclick = () => { removeEventState.pendingUid = inst.uid === pending ? null : inst.uid; renderRemoveEventOverlay(); };
      grid.appendChild(div);
    });
    layoutCardFan(grid);
  }

  // 【登場時】カードをN枚引き、手札をM枚リムーブする。
  function getDrawDiscardEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【登場時】カードを(\d+)枚引き、手札を(\d+)枚リムーブする。/);
    return m ? { drawCount: Number(m[1]), discardCount: Number(m[2]) } : null;
  }

  // 【パートナー(色)】【解決編】すべてのキャラをリムーブする。自分のFILEエリアにある
  // カードを上から2枚手札に加え、手札からレベル◯以下の【色】のキャラを1枚まで登場させる。
  // このターン中、自分はネクストヒントできない。(カッ等)
  function getBoardWipeEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【パートナー([^】]+?)】【解決編】すべてのキャラをリムーブする。自分のFILEエリアにあるカードを上から2枚手札に加え、手札からレベル(\d+)以下の【([^】]+?)】のキャラを1枚まで登場させる。このターン中、自分はネクストヒントできない。/);
    return m ? { partnerColor: m[1], levelMax: Number(m[2]), color: m[3] } : null;
  }

  // 【パートナー(色)】キャラを1枚まで選び、リムーブする。キャラを1枚まで選び、ターン終了時まで
  // 〚突撃〛を与える。自分と相手の現場にいるキャラ1枚につき、自分のデッキのカードを
  // 上からN枚リムーブする。(ミステリーコースター等。3段階の任意選択を順番に行う)
  function getMultiChoiceRemoveChargeMillEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【パートナー([^】]+?)】キャラを1枚まで選び、リムーブする。キャラを1枚まで選び、ターン終了時まで〚突撃〛（登場したターンからすぐにアクションできる）を与える。自分と相手の現場にいるキャラ1枚につき、自分のデッキのカードを上から(\d+)枚リムーブする。/);
    return m ? { partnerColor: m[1], millPerChar: Number(m[2]) } : null;
  }

  // 【登場時】自分の表向きの証拠をN枚まで選び、裏向きにする。(灰原哀(青)等)
  function getEvidenceFaceDownEntryEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【登場時】自分の表向きの証拠を(\d+)つまで選び、裏向きにする。/);
    return m ? { max: Number(m[1]) } : null;
  }

  // 証拠エリアのカードを直接クリックして選び、表向き⇔裏向きを切り替える汎用の仕組み。
  // mode:'toFaceUp'は裏向きの証拠を表向きに、'toFaceDown'は表向きの証拠を裏向きにする。
  // min未満では確定できず(コストとして必須の場合はmin=maxにする)、min=0なら「選ばない」を選べる
  let evidencePickState = null; // { side, sourceUid, mode, min, max, selectedUids, onComplete }
  function startEvidencePick(side, sourceUid, mode, max, onComplete, min){
    evidencePickState = { side, sourceUid, mode, min: min != null ? min : 0, max, selectedUids: [], onComplete: onComplete || null };
    renderBoard(match);
    renderPickHint();
  }
  function toggleEvidencePick(uid){
    if (!evidencePickState) return;
    const idx = evidencePickState.selectedUids.indexOf(uid);
    if (idx >= 0) {
      evidencePickState.selectedUids.splice(idx, 1);
    } else {
      if (evidencePickState.selectedUids.length >= evidencePickState.max) return;
      evidencePickState.selectedUids.push(uid);
    }
    renderBoard(match);
    renderPickHint();
  }
  function confirmEvidencePick(){
    if (!evidencePickState) return;
    if (evidencePickState.selectedUids.length < evidencePickState.min) return;
    const { side, selectedUids, mode, onComplete } = evidencePickState;
    const faceUp = mode === 'toFaceUp';
    selectedUids.forEach(uid => recordEvent({ type: 'evidenceFlip', side, uid, faceUp }));
    evidencePickState = null;
    renderBoard(match);
    renderPickHint();
    if (onComplete) onComplete(selectedUids);
  }
  function skipEvidencePick(){
    if (!evidencePickState || evidencePickState.min > 0) return;
    const { onComplete } = evidencePickState;
    evidencePickState = null;
    renderBoard(match);
    renderPickHint();
    if (onComplete) onComplete([]);
  }

  // 現場のカードを直接クリックして選び、ターン終了時まで指定のキーワードを与える
  // (選ばなくてもよい)。1825のような多段効果の途中ステップとしても使う(onComplete)
  let keywordGrantChoiceState = null; // { side, sourceUid, keyword, onComplete }
  function startKeywordGrantChoice(side, sourceUid, keyword, onComplete){
    keywordGrantChoiceState = { side, sourceUid, keyword, onComplete: onComplete || null };
    renderBoard(match);
    renderPickHint();
  }
  function selectKeywordGrantTarget(uid){
    if (!keywordGrantChoiceState) return;
    const { side, keyword, onComplete } = keywordGrantChoiceState;
    recordEvent({ type: 'tempKeywordGrant', side, targetUid: uid, keyword });
    keywordGrantChoiceState = null;
    renderPickHint();
    if (onComplete) onComplete();
  }
  function skipKeywordGrantChoice(){
    const { onComplete } = keywordGrantChoiceState || {};
    keywordGrantChoiceState = null;
    renderBoard(match);
    renderPickHint();
    if (onComplete) onComplete();
  }

  // 手札を直接クリックしてリムーブしてもらう(残り枚数がなくなるまで繰り返す、必須行動)
  let handDiscardState = null; // { side, sourceUid, remaining, onComplete }
  function startHandDiscard(side, sourceUid, count, onComplete){
    handDiscardState = { side, sourceUid, remaining: count, onComplete: onComplete || null };
    renderBoard(match);
    renderPickHint();
  }
  function selectHandDiscardTarget(uid){
    if (!handDiscardState) return;
    const { side, onComplete } = handDiscardState;
    const discardedCardId = uidToCardId(uid);
    const fromEl = document.querySelector(`.zone[data-side="${side}"] .hand-row .hcard[data-uid="${uid}"]`);
    const fromSnapshot = fromEl ? snapshotCardPosition(fromEl) : null;
    const cardImg = cardImage(uidToCardId(uid));
    recordEvent({ type: 'handDiscard', side, uid });
    handDiscardState.remaining -= 1;
    const toEl = document.querySelector(`.zone[data-side="${side}"] .remove-top`);
    const proceed = () => {
      const done = handDiscardState && handDiscardState.remaining <= 0;
      if (done) handDiscardState = null;
      renderBoard(match);
      renderPickHint();
      if (done && onComplete) onComplete(discardedCardId);
    };
    if (fromSnapshot && toEl) { flyGhostCard(fromSnapshot, toEl, cardImg); setTimeout(proceed, 320); }
    else proceed();
  }

  // 【ターン1】自分の現場にいるキャラのアクション［事件］によって証拠を得たとき、
  // 手札を1枚リムーブしてもよい。そうした場合、証拠を1つ得る。(メアリーLv6等)
  function getBonusEvidenceOnActionEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return false;
    return c.ability_text.includes(
      '【ターン1】自分の現場にいるキャラのアクション［事件］によって証拠を得たとき、手札を1枚リムーブしてもよい。そうした場合、証拠を1つ得る。'
    );
  }
  let bonusEvidenceState = null; // { side, sourceUid }
  function offerBonusEvidence(side, sourceUid){
    bonusEvidenceState = { side, sourceUid };
    renderBoard(match);
    renderPickHint();
  }
  function selectBonusEvidenceHand(uid){
    if (!bonusEvidenceState) return;
    const { side, sourceUid } = bonusEvidenceState;
    match.turn.declaredAbilityUids.push(sourceUid);
    const fromEl = document.querySelector(`.zone[data-side="${side}"] .hand-row .hcard[data-uid="${uid}"]`);
    const fromSnapshot = fromEl ? snapshotCardPosition(fromEl) : null;
    const cardImg = cardImage(uidToCardId(uid));
    recordEvent({ type: 'handDiscard', side, uid });
    bonusEvidenceState = null;
    renderPickHint();
    const toEl = document.querySelector(`.zone[data-side="${side}"] .remove-top`);
    const grantEvidence = () => {
      const deckEl = document.querySelector(`.zone[data-side="${side}"] .cardback-face`);
      recordEvent({ type: 'addEvidence', side });
      const evStack = document.querySelector(`.zone[data-side="${side}"] .evidence-stack`);
      const lastBack = evStack ? evStack.querySelector('.evi-card-back:last-child') : null;
      if (lastBack) flyGhostCard(deckEl, lastBack);
      renderBoard(match);
    };
    if (fromSnapshot && toEl) { flyGhostCard(fromSnapshot, toEl, cardImg); setTimeout(grantEvidence, 320); }
    else grantEvidence();
  }
  function skipBonusEvidence(){
    if (!bonusEvidenceState) return;
    match.turn.declaredAbilityUids.push(bonusEvidenceState.sourceUid);
    bonusEvidenceState = null;
    renderBoard(match);
    renderPickHint();
  }

  // 【現場リムーブ時】の直後に続く一文が、選択を伴わないシンプルな効果の場合だけ対応する
  // (このアプリではコンタクトでのリムーブからしか発動できない。条件アイコン【相手ターン中】は
  // 「アクションされた側(=非ターンプレイヤー)のキャラがリムーブされた」という状況では常に
  // 満たされるため、特別扱いせず無視してよい)
  function getFieldRemoveSimpleEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【現場リムーブ時】(?:【[^】]*】)*([^\n]*)/);
    if (!m) return null;
    const clause = m[1].trim();
    if (clause === 'カードを1枚引く。') return { type: 'draw' };
    if (clause === '相手は手札を1枚リムーブする。') return { type: 'oppHandRemove' };
    return null;
  }
  // 【現場リムーブ時】自分のデッキのカードを上からN枚見る。その中から(レベルM以下の)
  // 【色】のキャラを1枚までスリープ状態で登場させ、残りを(好きな順番で)デッキの下に移す。
  // (灰原哀Lv5等。選択が必要なのでdeckPeekの仕組みを流用する)
  function getFieldRemoveChoiceEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【現場リムーブ時】自分のデッキのカードを上から(\d+)枚見る。その中から(?:レベル(\d+)以下の)?【([^】]+?)】のキャラを1枚までスリープ状態で登場させ、残りを(?:好きな順番で)?デッキの下に移す。/);
    if (!m) return null;
    return { count: Number(m[1]), levelMax: m[2] != null ? Number(m[2]) : null, color: m[3] };
  }
  // 【現場リムーブ時】自分の現場に〚特徴［○○］〛のキャラがいる場合、AP◯以下のキャラを
  // 1枚まで選び、リムーブする。(毒島桐子等。コストなし、対象は自分・相手どちらの現場でも可)
  function getFieldRemoveConditionalChoiceEffect(cardId){
    const c = CARD_BY_ID.get(cardId);
    if (!c || !c.ability_text) return null;
    const m = c.ability_text.match(/【現場リムーブ時】自分の現場に〚特徴［([^］]+)］〛のキャラがいる場合、AP(\d+)以下のキャラを1枚まで選び、リムーブする。/);
    return m ? { trait: m[1], apLimit: Number(m[2]) } : null;
  }
  // コンタクトでキャラが実際にリムーブされた直後に呼ぶ。removedSideはリムーブされた
  // キャラの持ち主、actorSideはアクションした側(=リムーブされた側からみた「相手」)
  function triggerFieldRemoveAbility(removedSide, removedCard, actorSide){
    const choiceEffect = getFieldRemoveChoiceEffect(removedCard.cardId);
    if (choiceEffect) {
      startDeckPeek(removedSide, removedCard.uid, { ...choiceEffect, forceRemove: false, destination: 'fieldSleeping' });
      return;
    }
    const condChoiceEffect = getFieldRemoveConditionalChoiceEffect(removedCard.cardId);
    if (condChoiceEffect) {
      const hasTraitOnField = match[removedSide].field.some(c => cardHasTrait(CARD_BY_ID.get(c.cardId), condChoiceEffect.trait));
      if (hasTraitOnField) {
        startPartnerRemove(removedSide, removedCard.uid, condChoiceEffect.apLimit, { filterType: 'ap', costType: 'none' });
      }
      return;
    }
    const effect = getFieldRemoveSimpleEffect(removedCard.cardId);
    if (!effect) return;
    if (effect.type === 'draw') {
      const deckEl = document.querySelector(`.zone[data-side="${removedSide}"] .cardback-face`);
      recordEvent({ type: 'fieldRemoveTrigger', side: removedSide, effectType: 'draw' });
      const handRow = document.querySelector(`.zone[data-side="${removedSide}"] .hand-row`);
      const lastCard = handRow ? handRow.querySelector('.card-menu-wrap:last-child .hcard') : null;
      fadeDrawCard(deckEl, lastCard);
    } else if (effect.type === 'oppHandRemove') {
      const handCards = match[actorSide].hand;
      if (handCards.length === 0) return;
      const idx = Math.floor(Math.random() * handCards.length);
      const target = handCards[idx];
      const fromEl = document.querySelector(`.zone[data-side="${actorSide}"] .hand-row .hcard[data-uid="${target.uid}"]`);
      const fromSnapshot = fromEl ? snapshotCardPosition(fromEl) : null;
      const cardImg = cardImage(target.cardId);
      recordEvent({ type: 'fieldRemoveTrigger', side: actorSide, effectType: 'handRemoveByUid', uid: target.uid });
      const toEl = document.querySelector(`.zone[data-side="${actorSide}"] .remove-top`);
      if (fromSnapshot && toEl) flyGhostCard(fromSnapshot, toEl, cardImg);
    }
  }

  // ---- 登場時効果：デッキの上からN枚を見て色が合えば手札に加える ----
  // カードは押した瞬間に確定せず、いったん選択(ハイライト)した上で「はい/いいえ」で確定させる。
  // 残りのカードは公式ルール通り「好きな順番」でデッキの下に戻せる(reorderステップ)
  let deckPeekState = null;
  // { side, sourceUid, color, forceRemove, mandatory, revealedUids, step:'choose'|'remove'|'reorder',
  //   chosenUid, pendingUid, removedHandUid, remainingUids, orderedUids }
  function startDeckPeek(side, sourceUid, effect){
    const s = match[side];
    const revealedUids = s.deckPile.slice(0, effect.count).map(c => c.uid);
    deckPeekState = {
      side, sourceUid, color: effect.color, forceRemove: effect.forceRemove, mandatory: !!effect.mandatory,
      levelMax: effect.levelMax != null ? effect.levelMax : null,
      destination: effect.destination || 'hand',
      revealedUids, step: 'choose',
      chosenUid: null, pendingUid: null, removedHandUid: null,
      remainingUids: [], orderedUids: [],
    };
    // 「公開したカードが【色】の場合、手札に加える」の1枚公開系は選択の余地がない
    // (合致すれば必ず加える)ので、合致した1枚を自動で選択状態にしておく
    if (deckPeekState.mandatory) {
      const matchUid = revealedUids.find(uid => {
        const inst = s.deckPile.find(c => c.uid === uid);
        return inst && cardHasColor(CARD_BY_ID.get(inst.cardId), deckPeekState.color);
      });
      if (matchUid) deckPeekState.pendingUid = matchUid;
    }
    renderDeckPeekOverlay();
  }
  function goToReorderOrFinalize(){
    deckPeekState.remainingUids = deckPeekState.revealedUids.filter(u => u !== deckPeekState.chosenUid);
    deckPeekState.orderedUids = [];
    if (deckPeekState.remainingUids.length <= 1) {
      // 1枚以下なら順番を選ぶ意味がないのでそのまま確定する
      finalizeDeckPeek(deckPeekState.remainingUids.slice());
    } else {
      deckPeekState.step = 'reorder';
      renderDeckPeekOverlay();
    }
  }
  function confirmDeckPeekChoice(chosenUid){
    deckPeekState.chosenUid = chosenUid;
    deckPeekState.pendingUid = null;
    // 選んだカードは、この時点で本当に手札に加える(以降「remove」ステップでは
    // 本物の手札から選べるようにするため)
    recordEvent({
      type: 'deckPeekChoose', side: deckPeekState.side, sourceUid: deckPeekState.sourceUid,
      revealedCount: deckPeekState.revealedUids.length, chosenUid, destination: deckPeekState.destination,
    });
    if (chosenUid && deckPeekState.forceRemove) {
      deckPeekState.step = 'remove';
      renderDeckPeekOverlay(); // ダイアログは閉じ、手札から直接選んでもらう
      renderBoard(match); // 手札のハイライトを付けるため再描画
      renderPickHint();
    } else {
      goToReorderOrFinalize();
    }
  }
  // 手札のカードを直接クリックしてリムーブするカードを選ぶ。実際にリムーブエリアへ
  // 飛んでいくのが見えてから、次のステップ(順番選択など)に進むようにする
  function confirmDeckPeekRemove(removedHandUid){
    if (!deckPeekState || deckPeekState.step !== 'remove') return;
    const side = deckPeekState.side;
    const fromEl = document.querySelector(`.zone[data-side="${side}"] .hand-row .hcard[data-uid="${removedHandUid}"]`);
    // recordEvent()が手札を再描画すると元の要素はDOMから外れてしまうため、
    // 消える前に位置・向きを控えておく(flyGhostCardには要素ではなくスナップショットを渡す)
    const fromSnapshot = fromEl ? snapshotCardPosition(fromEl) : null;
    const cardImg = cardImage(uidToCardId(removedHandUid));
    deckPeekState.removedHandUid = removedHandUid;
    deckPeekState.pendingUid = null;
    recordEvent({ type: 'deckPeekRemove', side, removedHandUid });
    renderPickHint();
    const toEl = document.querySelector(`.zone[data-side="${side}"] .remove-top`);
    if (fromSnapshot && toEl) {
      flyGhostCard(fromSnapshot, toEl, cardImg);
      setTimeout(() => goToReorderOrFinalize(), 320);
    } else {
      goToReorderOrFinalize();
    }
  }
  function finalizeDeckPeek(remainingOrder){
    const { side, sourceUid, chosenUid, destination } = deckPeekState;
    recordEvent({ type: 'deckPeekReorder', side, sourceUid, remainingOrder });
    deckPeekState = null;
    renderDeckPeekOverlay();
    // ヒントバー(「手札から1枚クリックしてリムーブしてください」等)が、処理が実際には
    // 完了した後も古い文言のまま残ってしまわないよう、ここで必ず更新する
    renderPickHint();
    // 「デッキから直接、現場にスリープ状態で登場させる」効果(灰原哀Lv5等)は、
    // カード効果文が「登場させる」と明記している通り正式な登場として扱い、
    // 登場時と同じ光るエフェクトを見せてから、置かれたカード自身の登場時能力を発動させる
    if (chosenUid && destination === 'fieldSleeping') {
      const cardId = uidToCardId(chosenUid);
      const fieldEl = document.querySelector(`.zone[data-side="${side}"] .field-row .char-card[data-uid="${chosenUid}"]`);
      const afterFlash = () => { showCardSpotlight(cardId); runEntryAbility(side, chosenUid, cardId); };
      if (fieldEl) {
        fieldEl.classList.add('landing-flash');
        setTimeout(() => { fieldEl.classList.remove('landing-flash'); afterFlash(); }, 1000);
      } else {
        afterFlash();
      }
    }
  }
  function renderDeckPeekOverlay(){
    const overlay = document.getElementById('deckPeekOverlay');
    // 「remove」ステップは手札から直接選んでもらうので、ダイアログは表示しない
    if (!deckPeekState || deckPeekState.step === 'remove') {
      if (!partnerRemoveState && !removeEventState && !(actionState && actionState.step === 'guard')) overlay.style.display = 'none';
      return;
    }
    overlay.style.display = 'flex';
    document.getElementById('deckPeekTitle').textContent = '登場時効果';
    const sourcePanel = document.getElementById('deckPeekSource');
    const sourceCardId = uidToCardId(deckPeekState.sourceUid);
    sourcePanel.style.display = sourceCardId != null ? 'flex' : 'none';
    if (sourceCardId != null) {
      sourcePanel.innerHTML = `<img src="${cardImage(sourceCardId)}" alt="${cardName(sourceCardId)}">`;
    }
    const s = match[deckPeekState.side];
    const grid = document.getElementById('deckPeekCards');
    const hint = document.getElementById('deckPeekHint');
    const skipBtn = document.getElementById('deckPeekSkipBtn');
    const yesNoWrap = document.getElementById('deckPeekYesNo');
    const yesBtn = document.getElementById('deckPeekYesBtn');
    const noBtn = document.getElementById('deckPeekNoBtn');
    grid.innerHTML = '';
    skipBtn.style.display = 'none';
    yesNoWrap.style.display = 'none';
    yesBtn.textContent = 'はい';
    noBtn.textContent = 'いいえ';

    if (deckPeekState.step === 'reorder') {
      const { remainingUids, orderedUids } = deckPeekState;
      hint.textContent = `残り${remainingUids.length}枚をデッキの一番下に戻す順番を選んでください（クリックした順に、上から積んで戻します）。`;
      remainingUids.forEach(uid => {
        const inst = s.deckPile.find(c => c.uid === uid);
        if (!inst) return;
        const orderIdx = orderedUids.indexOf(uid);
        const div = document.createElement('div');
        div.className = 'mulligan-card' + (orderIdx !== -1 ? ' selected' : '');
        div.innerHTML = `<img src="${cardImage(inst.cardId)}" alt="${cardName(inst.cardId)}">` +
          (orderIdx !== -1 ? `<div class="order-badge">${orderIdx + 1}</div>` : '');
        if (orderIdx === -1) {
          div.onclick = () => { deckPeekState.orderedUids.push(uid); renderDeckPeekOverlay(); };
        } else {
          // もう一度クリックしたら選択を外す(後ろの番号は詰める)
          div.onclick = () => { deckPeekState.orderedUids.splice(orderIdx, 1); renderDeckPeekOverlay(); };
        }
        grid.appendChild(div);
      });
      layoutCardFan(grid);
      if (orderedUids.length === remainingUids.length) {
        yesNoWrap.style.display = 'flex';
        yesBtn.textContent = 'この順番で戻す';
        noBtn.textContent = 'やり直す';
        yesBtn.onclick = () => finalizeDeckPeek(orderedUids.slice());
        noBtn.onclick = () => { deckPeekState.orderedUids = []; renderDeckPeekOverlay(); };
      }
      return;
    }

    // この時点でstepは'choose'のみ('remove'は上で早期リターン、'reorder'も上で処理済み)
    const pending = deckPeekState.pendingUid;
    yesNoWrap.style.display = pending ? 'flex' : 'none';
    skipBtn.style.display = pending ? 'none' : '';
    if (pending) {
      yesBtn.onclick = () => confirmDeckPeekChoice(pending);
      if (deckPeekState.mandatory) {
        // 「公開したカードが～の場合、手札に加える」は選べる効果ではなく必ず加えるので、
        // 取り消し(いいえ)は出さず、確認するだけにする
        noBtn.style.display = 'none';
        yesBtn.textContent = '手札に加える';
      } else {
        noBtn.style.display = '';
        noBtn.textContent = 'いいえ';
        noBtn.onclick = () => { deckPeekState.pendingUid = null; renderDeckPeekOverlay(); };
      }
    }
    // カードを選んでも案内文の高さが変わって配置がズレないよう、選択中かどうかに
    // かかわらず常に効果テキストを表示する(確認は「はい/いいえ」ボタンだけで行う)
    const abilityText = CARD_BY_ID.get(sourceCardId)?.ability_text || '';
    hint.textContent = abilityText;
    hint.style.display = abilityText ? '' : 'none';
    skipBtn.textContent = '手札に加えない';
    skipBtn.onclick = () => confirmDeckPeekChoice(null);
    deckPeekState.revealedUids.forEach(uid => {
      const inst = s.deckPile.find(c => c.uid === uid);
      if (!inst) return;
      const c = CARD_BY_ID.get(inst.cardId);
      const matches = cardHasColor(c, deckPeekState.color)
        && (deckPeekState.levelMax == null || (c && c.level != null && c.level <= deckPeekState.levelMax));
      const div = document.createElement('div');
      div.className = 'mulligan-card' + (matches ? '' : ' dim') + (uid === pending ? ' selected' : '');
      div.innerHTML = `<img src="${cardImage(inst.cardId)}" alt="${cardName(inst.cardId)}">`;
      if (matches && !deckPeekState.mandatory) {
        // 他のカードを選ぶと選択が切り替わる。選択中のカードをもう一度クリックすると選択を外す
        div.onclick = () => { deckPeekState.pendingUid = uid === pending ? null : uid; renderDeckPeekOverlay(); };
      }
      grid.appendChild(div);
    });
    layoutCardFan(grid);
  }

  // 手札のように少し扇状に開いて重ねて見えるよう、カードグリッドの各要素に
  // 回転+縦オフセットを付ける(選択中のカードは少し高く浮かせる)
  function layoutCardFan(container){
    container.classList.add('fan-layout');
    const children = Array.from(container.children);
    const total = children.length;
    const mid = (total - 1) / 2;
    children.forEach((el, index) => {
      const offset = index - mid;
      const rotate = offset * 8;
      const selected = el.classList.contains('selected');
      const lift = Math.abs(offset) * 10 - (selected ? 16 : 0);
      el.style.transform = `rotate(${rotate}deg) translateY(${lift}px)`;
      el.style.zIndex = String(selected ? 100 : index + 1);
    });
  }

  // ---- 登場時効果：【パートナー(色)】自分のパートナーが条件の色の場合のみ発動。
  // 手札を1枚リムーブしてもよい。そうした場合、AP◯◯以下のキャラを1枚まで選び、
