name: Daily card and price update

on:
  # GitHubは「毎時ちょうど(0分)」のスケジュールは混雑しやすく遅延しがちと公式に
  # 注意喚起している。実際に7/29〜8/1の4日間、0分ちょうど(18:00 UTC)指定だと
  # 毎日2時間40分〜3時間48分遅れて発火していたため、0分から外れた17分に変更した。
  schedule:
    - cron: "17 17 * * *"  # 毎日 UTC17:17 = JST 2:17(遅延を見込んで本来の3:00より早めに設定)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # 駿河屋はGitHub Actionsのクラウド(データセンター)IPを403でブロックするため、
  # このジョブだけ通常回線を持つセルフホストランナー(自分のPC)で実行する。
  # 逆にカードラボ・竜のしっぽはそのPCの回線(会社Wi-Fi)側で接続リセットされるため、
  # 元通りGitHub Actions側で実行する(fetch_others_and_publishジョブ)。
  fetch_surugaya:
    runs-on: [self-hosted, self-hosted-conan]
    timeout-minutes: 60
    env:
      # セルフホストランナー(このPC)のPython 3.12への絶対パス。ランナーサービスは
      # NETWORK SERVICEアカウントで動作しており、PCのPATH変更がサービスに反映されるのは
      # 次回OS再起動後のため、PATHに頼らずフルパスで直接指定する。
      PYTHON: C:\Users\kazuya.tohara\AppData\Local\Programs\Python\Python312\python.exe
      # Windows既定のコードページ(cp932)だとログ内の日本語が文字化けするため、
      # Pythonの標準出力/エラー出力を明示的にUTF-8に固定する。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # セルフホストランナー(このPC)にはPython 3.12が既に入っているため、
      # actions/setup-pythonは使わない(NETWORK SERVICEアカウントにレジストリ変更権限が無く失敗するため)。
      - name: Install dependencies
        run: ${{ env.PYTHON }} -m pip install -r requirements.txt

      # 以前はactions/cacheのrestore-keys(前方一致でその時点の最新キャッシュを復元)を
      # 使っていたが、7/31頃から常に同じ古いキャッシュキーだけが復元され続けるという
      # 不具合が発生し、それ以降の価格履歴が毎回上書きで消え続けていたことが判明した
      # (原因はGitHub Actions側の挙動と見られ、こちらでは制御できない)。
      # 曖昧な前方一致検索が原因の可能性が高いため、名前が変わらない固定のGitHub
      # Releaseアセット(db-store)への確実な上書き保存に切り替えた。初回(移行直後)は
      # まだアセットが無いので、その場合だけ旧cacheから一度きり復元して橋渡しする。
      - name: Restore price/card database (accumulates across daily runs)
        id: release_restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $gh = "C:\Program Files\GitHub CLI\gh.exe"
          if (-not (Test-Path $gh)) { $gh = "gh" }
          & $gh release download db-store --repo ${{ github.repository }} --pattern conan_tcg.db --dir data --clobber
          if ($LASTEXITCODE -eq 0) {
            echo "found=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "found=false" >> $env:GITHUB_OUTPUT
            # Note (kept in ASCII on purpose): Windows PowerShell 5.1 misreads
            # non-ASCII text in this inline script as the system codepage,
            # which previously corrupted a quoted string and broke parsing.
            Write-Host "db-store release asset not found yet (expected on first run after migration). Falling back to the old cache once."
          }
          # PowerShell keeps $LASTEXITCODE from the `gh` call above even after
          # it's handled here, and GitHub Actions fails the step based on that
          # value - reset it explicitly so a "not found yet" outcome isn't
          # treated as a step failure.
          exit 0
        shell: powershell

      - name: (Migration bridge) restore from old cache if the release asset was missing
        if: steps.release_restore.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/conan_tcg.db
          key: conan-tcg-db-${{ github.run_id }}
          restore-keys: |
            conan-tcg-db-

      - name: Sync card list (diff update)
        run: ${{ env.PYTHON }} scraper_cards.py

      - name: Fetch high-rarity prices from Suruga-ya
        run: ${{ env.PYTHON }} web/scraper_prices_surugaya.py

      # ジョブ間のDB引き継ぎはcacheではなくartifactを使う。cacheのsave/restoreは
      # 同一run内でも保存直後に別ジョブから読めない(反映の時間差がある)ことがあり、
      # 実際にこれが原因で駿河屋の取得結果が次のジョブに渡らず消えたことがあった。
      # artifactはrun内で確実に一貫性があるのでこちらを使う。
      - name: Hand off database to the next job
        uses: actions/upload-artifact@v4
        with:
          name: conan-tcg-db
          path: data/conan_tcg.db
          retention-days: 1

  fetch_others_and_publish:
    needs: fetch_surugaya
    runs-on: ubuntu-latest
    # わいTV追加後、カードラボ・竜のしっぽ・メルカード・フルアヘッド・わいTV・goods・
    # exportまで含めると60分を超えることがあり、実際にわいTVの途中でタイムアウト
    # 打ち切りになった(2026-08-13)ため90分に延長。さらにまんぞく屋・トレカバースを
    # 追加すると(特にトレカバースは12カテゴリを30秒間隔で巡回するため約12〜13分)
    # 90分でも心許ないため、余裕を持って120分に延長する。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Receive database from the Suruga-ya job
        uses: actions/download-artifact@v4
        with:
          name: conan-tcg-db
          path: data

      - name: Fetch high-rarity prices from Card Labo
        run: python web/scraper_prices_cardlabo.py

      - name: Fetch high-rarity prices from Ryuu no Shippo
        run: python web/scraper_prices_ryuunoshippo.py

      - name: Import cards not on the official card list (e.g. Executive Collection)
        run: python web/scraper_executive_collection.py

      - name: Fetch prices from Mercard Akihabara
        run: python web/scraper_prices_mercard.py

      - name: Fetch prices from Full Ahead
        run: python web/scraper_prices_fullahead.py

      - name: Fetch prices from Card Shop WaiTV
        run: python web/scraper_prices_waitv.py

      - name: Fetch prices from Manzokuya
        run: python web/scraper_prices_manzokuya.py

      - name: Fetch prices from Torecabirth
        run: python web/scraper_prices_torecabirth.py

      - name: Fetch official goods/products list
        run: python web/scraper_goods.py

      - name: Export static JSON for the site
        run: python web/export_static.py

      # カードごとに固有のURL(card/{id}.html)を持つ検索エンジン向けの静的ページを
      # 生成する(2026-08-18追加)。個別カード名+「相場」等の検索に直接ヒットできる
      # ようにするため。sitemap.xmlもここで全ページ分を再生成する。
      - name: Generate per-card SEO pages
        run: python web/generate_card_pages.py

      # 固定名のReleaseアセットに毎回上書きする(--clobber)。cache/saveと違って
      # キー名の曖昧な前方一致検索が発生しないため、確実に最新状態を次回に引き継げる。
      - name: Save price/card database for the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload db-store data/conan_tcg.db --repo ${{ github.repository }} --clobber

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/site/data/cards.json web/site/data/prices.json web/site/data/trends.json web/site/data/movers.json web/site/data/meta.json web/site/data/goods.json web/site/data/unofficial-cards.json web/site/card/ web/site/sitemap.xml
          git diff --cached --quiet || git commit -m "chore: daily card/price update"
          # このジョブは駿河屋取得(30秒間隔のクロール遅延込み)のせいで50〜90分かかることがあり、
          # その間に他のpush(手動でのコード修正など)が入ると素のgit pushは
          # "fetch first"で弾かれる。以前は単純にrebaseで追従していたが、手動作業側も
          # 同じデータファイル(cards.json/prices.json等)を更新しているとrebaseが
          # コンフリクトして失敗し、このジョブが取得した分がまるごと失われる事故が
          # 実際に起きた(2026-08-14)。このジョブが対象にしているのはこのデータ
          # ファイル・自動生成ページ群だけなので、コンフリクトが起きた場合は
          # このジョブ自身が今まさに生成した内容
          # (DBから再エクスポートした最新の状態)を優先して構わない。そのため
          # rebaseではなくmerge -X oursを使い、コンフリクトしても自動的に自分の
          # 内容で解決してpushを継続できるようにする。
          git fetch origin master
          git merge -X ours origin/master --no-edit
          git push
