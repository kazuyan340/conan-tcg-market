name: Daily card and price update

on:
  schedule:
    - cron: "0 18 * * *"  # 毎日 UTC18:00 = JST 3:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # 駿河屋はGitHub Actionsのクラウド(データセンター)IPを403でブロックするため、
  # このジョブだけ通常回線を持つセルフホストランナー(自分のPC)で実行する。
  # 逆にカードラボ・竜のしっぽはそのPCの回線(会社Wi-Fi)側で接続リセットされるため、
  # 元通りGitHub Actions側で実行する(fetch_others_and_publishジョブ)。
  fetch_surugaya:
    runs-on: [self-hosted, self-hosted-conan]
    timeout-minutes: 60
    env:
      # セルフホストランナー(このPC)のPython 3.12への絶対パス。ランナーサービスは
      # NETWORK SERVICEアカウントで動作しており、PCのPATH変更がサービスに反映されるのは
      # 次回OS再起動後のため、PATHに頼らずフルパスで直接指定する。
      PYTHON: C:\Users\kazuya.tohara\AppData\Local\Programs\Python\Python312\python.exe
      # Windows既定のコードページ(cp932)だとログ内の日本語が文字化けするため、
      # Pythonの標準出力/エラー出力を明示的にUTF-8に固定する。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # セルフホストランナー(このPC)にはPython 3.12が既に入っているため、
      # actions/setup-pythonは使わない(NETWORK SERVICEアカウントにレジストリ変更権限が無く失敗するため)。
      - name: Install dependencies
        run: ${{ env.PYTHON }} -m pip install -r requirements.txt

      - name: Restore price/card database (accumulates across daily runs)
        uses: actions/cache/restore@v4
        with:
          path: data/conan_tcg.db
          key: conan-tcg-db-${{ github.run_id }}
          restore-keys: |
            conan-tcg-db-

      - name: Sync card list (diff update)
        run: ${{ env.PYTHON }} scraper_cards.py

      - name: Fetch high-rarity prices from Suruga-ya
        run: ${{ env.PYTHON }} web/scraper_prices_surugaya.py

      # ジョブ間のDB引き継ぎはcacheではなくartifactを使う。cacheのsave/restoreは
      # 同一run内でも保存直後に別ジョブから読めない(反映の時間差がある)ことがあり、
      # 実際にこれが原因で駿河屋の取得結果が次のジョブに渡らず消えたことがあった。
      # artifactはrun内で確実に一貫性があるのでこちらを使う。
      - name: Hand off database to the next job
        uses: actions/upload-artifact@v4
        with:
          name: conan-tcg-db
          path: data/conan_tcg.db
          retention-days: 1

  fetch_others_and_publish:
    needs: fetch_surugaya
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Receive database from the Suruga-ya job
        uses: actions/download-artifact@v4
        with:
          name: conan-tcg-db
          path: data

      - name: Fetch high-rarity prices from Card Labo
        run: python web/scraper_prices_cardlabo.py

      - name: Fetch high-rarity prices from Ryuu no Shippo
        run: python web/scraper_prices_ryuunoshippo.py

      - name: Export static JSON for the site
        run: python web/export_static.py

      - name: Save price/card database for the next run
        uses: actions/cache/save@v4
        with:
          path: data/conan_tcg.db
          key: conan-tcg-db-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/site/data/cards.json web/site/data/prices.json web/site/data/trends.json web/site/data/movers.json web/site/data/meta.json
          git diff --cached --quiet || git commit -m "chore: daily card/price update"
          git push
