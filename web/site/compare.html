<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>★ お気に入り | 名探偵コナンTCG カード図鑑</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <div class="title-row">
    <h1>★ お気に入り(価格チェック)</h1>
    <p id="last-updated" class="last-updated"></p>
    <div class="nav-links">
      <a href="trends.html?view=trends" class="reset-btn nav-btn">📊 価格の動きを見る</a>
      <a href="index.html" class="reset-btn nav-btn">← 一覧へ戻る</a>
    </div>
  </div>
  <button type="button" id="clear-compare" class="reset-btn">全部クリア</button>
</header>

<div id="price-check-grid" class="price-check-grid"></div>
<p id="empty-message" class="empty-message hidden">まだお気に入りがありません。一覧画面のカードにある☆をクリックすると、ここに価格グラフが並びます。</p>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-card">
    <button id="modal-close" class="modal-close">&times;</button>
    <div class="modal-body">
      <div class="modal-image">
        <img id="modal-image" alt="">
      </div>
      <div class="modal-info" id="modal-info"></div>
    </div>
    <div class="modal-price-section">
      <h3>相場推移</h3>
      <div id="modal-price-stats" class="price-stats"></div>
      <canvas id="price-chart" width="700" height="150"></canvas>
      <p id="price-empty" class="price-empty hidden">価格データがありません。</p>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="compare.js"></script>
</body>
</html>
