<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名探偵コナンTCG AIビューア</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif; color:#fff;
    background:linear-gradient(180deg, #2c3550 0%, #232a42 38%, #3a3226 60%, #4a3d28 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:40px;
  }
  h1{ font-size:28px; letter-spacing:.06em; text-shadow:0 3px 10px rgba(0,0,0,.4); }
  .menu{ display:flex; gap:28px; flex-wrap:wrap; justify-content:center; max-width:960px; }
  .menu-card{
    width:220px; height:280px; border-radius:20px; background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.25); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.35); transition:transform .15s, background .15s;
  }
  .menu-card:hover{ transform:translateY(-6px); background:rgba(255,255,255,.14); }
  .menu-card .icon{ font-size:48px; }
  .menu-card .label{ font-size:16px; font-weight:800; letter-spacing:.03em; }
  .menu-card .desc{ font-size:11px; opacity:.7; text-align:center; padding:0 20px; }
</style>
<script src="js/image-mode.js"></script>
</head>
<body>
  <h1>🔍 DETECTIVE CONAN CARD GAME</h1>
  <div class="menu">
    <div class="menu-card" onclick="location.href='battle.html'">
      <div class="icon">🎮</div>
      <div class="label">対戦する</div>
      <div class="desc">2つのデッキを自分で操作して対戦・リプレイ</div>
    </div>
    <div class="menu-card" onclick="location.href='deckbuilder.html'">
      <div class="icon">🛠️</div>
      <div class="label">デッキ作成</div>
      <div class="desc">カードを選んでデッキを組む</div>
    </div>
    <div class="menu-card" onclick="location.href='replays.html'">
      <div class="icon">📼</div>
      <div class="label">リプレイ再生</div>
      <div class="desc">保存した過去の対戦を選んで再生</div>
    </div>
    <div class="menu-card" onclick="location.href='online.html'">
      <div class="icon">🌐</div>
      <div class="label">オンライン対戦</div>
      <div class="desc">同じパスを入れて友達と対戦(縦向き画面)</div>
    </div>
    <div class="menu-card" id="menuImages" onclick="location.href='images.html'">
      <div class="icon">🖼️</div>
      <div class="label">画像設定</div>
      <div class="desc">カード画像を置いたフォルダを指定する</div>
    </div>
  </div>
<script>if (window.BUNDLED_IMAGES) { var mi = document.getElementById('menuImages'); if (mi) mi.style.display = 'none'; }</script>
</body>
</html>
